<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>최종 결과 연출 예시</title>
<style>html,body{margin:0;height:100%;background:#05060f;color:#fff;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.demo{min-height:100%;display:grid;place-items:center;align-content:center;gap:14px;text-align:center;padding:24px}
.demo h1{margin:0;font-size:28px}.demo p{margin:0;opacity:.7;font-size:14px;line-height:1.6}
.demo button{min-height:52px;padding:0 30px;border:0;border-radius:999px;font:inherit;font-size:17px;font-weight:800;color:#1a1200;background:linear-gradient(90deg,#ffd76a,#fff1c2);cursor:pointer}
/* v96 최종 결과 3D 공개 연출: 차분하고 깔끔한 글자와 판 */
html.f3on,html.f3on body{overflow:hidden}
.f3{position:fixed;inset:0;z-index:300;background:#0b0c10;color:#f3f4f7;font-family:"FR3 Pretendard","Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;animation:f3in .8s ease both;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.f3.out{animation:f3out .5s ease both}
@keyframes f3in{from{opacity:0}to{opacity:1}}@keyframes f3out{to{opacity:0}}
.f3c{position:absolute;inset:0;width:100%;height:100%;display:block}
.f3load{position:absolute;inset:0;display:grid;place-items:center}
.f3load i{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,.12);border-top-color:rgba(255,255,255,.7);animation:f3spin 1s linear infinite}
@keyframes f3spin{to{transform:rotate(360deg)}}
.f3ui{position:absolute;inset:0;pointer-events:none}
.f3ui button{pointer-events:auto;font:inherit}
.f3vig{position:absolute;inset:0;background:radial-gradient(ellipse 120% 90% at 50% 45%,transparent 60%,rgba(0,0,0,.45) 100%)}
.f3cap{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));top:calc(22px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:baseline;font-size:13px}
.f3cap b{font-weight:600;color:#fff}
.f3cap span{color:rgba(255,255,255,.45);font-weight:400}
.f3stage{position:absolute;right:calc(24px + env(safe-area-inset-right,0px));top:calc(22px + env(safe-area-inset-top,0px));font-size:13px;color:rgba(255,255,255,.6)}
.f3stage span{display:inline-block;animation:f3rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes f3rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.f3hero{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.f3t{display:grid;gap:12px;animation:f3hero 1.6s cubic-bezier(.2,.7,.2,1) both}
.f3t.out{animation:f3heroout 1.4s ease both}
.f3t small{font-size:13px;font-weight:500;color:rgba(255,255,255,.5);letter-spacing:.02em}
.f3t h1{margin:0;font-size:clamp(40px,7vw,76px);font-weight:600;letter-spacing:-.035em;line-height:1.05;color:#fff}
.f3t p{margin:0;font-size:15px;color:rgba(255,255,255,.55)}
@keyframes f3hero{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes f3heroout{to{opacity:0;transform:translateY(-10px);filter:blur(4px)}}
.f3side{position:absolute;right:calc(24px + env(safe-area-inset-right,0px));top:64px;bottom:104px;width:min(340px,calc(100% - 48px));display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.f3p{pointer-events:auto;max-height:100%;display:flex;flex-direction:column;border-radius:18px;background:rgba(18,20,26,.72);border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);animation:f3panel .9s cubic-bezier(.2,.7,.2,1) both;overflow:hidden}
@keyframes f3panel{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.f3p header{display:flex;justify-content:space-between;align-items:baseline;padding:18px 20px 12px;border-bottom:1px solid rgba(255,255,255,.07)}
.f3p header b{font-size:16px;font-weight:600}
.f3p header span{font-size:12px;color:rgba(255,255,255,.45)}
.f3p footer{padding:12px 20px 16px;font-size:12px;color:rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.07)}
.f3names{list-style:none;margin:0;padding:10px 20px;display:grid;grid-template-columns:1fr 1fr;gap:0 16px;overflow:auto}
.f3names li{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:15px;font-weight:500;animation:f3rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 40ms)}
.f3p ol{list-style:none;margin:0;padding:6px 8px;overflow:auto;flex:1;min-height:0}
.f3p ol li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;font-size:14px;animation:f3rise .5s cubic-bezier(.2,.7,.2,1) both}
.f3p ol li b{font-weight:600;color:rgba(255,255,255,.45);font-size:13px}
.f3p ol li span{font-weight:500;display:flex;gap:6px;align-items:baseline}
.f3p ol li span small{font-size:10px;font-weight:600;color:#e7c27a;letter-spacing:.02em}
.f3p ol li em{font-style:normal;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.f3p ol li.me{background:rgba(143,180,255,.1)}
.f3p ol li.top b{color:var(--mc)}
.f3p ol li.k1{--mc:#e7c27a}.f3p ol li.k2{--mc:#d6dbe3}.f3p ol li.k3{--mc:#d2976a}
.f3p ol li.top span{font-weight:600}
.f3tick ol{-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent);mask-image:linear-gradient(to bottom,#000 70%,transparent)}
.f3re{border:1px solid rgba(255,255,255,.14);background:transparent;color:rgba(255,255,255,.8);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer}
.f3re:hover{background:rgba(255,255,255,.06)}
.f3card{position:absolute;left:calc(28px + env(safe-area-inset-left,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px));pointer-events:none}
.f3rv{display:grid;gap:6px;animation:f3hero 1.2s cubic-bezier(.2,.7,.2,1) .2s both}
.f3rv span{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:rgba(255,255,255,.6)}
.f3rv span i{width:8px;height:8px;border-radius:50%;background:var(--mc)}
.f3rv h2{margin:0;font-size:clamp(36px,5.2vw,58px);font-weight:600;letter-spacing:-.035em;line-height:1.05}
.f3rv p{margin:0;font-size:15px;color:rgba(255,255,255,.6)}
.f3rv.k1{--mc:#e7c27a}.f3rv.k2{--mc:#d6dbe3}.f3rv.k3{--mc:#d2976a}
.f3rv.k1 h2{color:#f4e2bc}
.f3bot{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.f3next{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px 0 24px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s,border-color .2s}
.f3next:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28)}
.f3next i{width:14px;height:14px;position:relative}
.f3next i::before{content:'';position:absolute;left:0;top:6px;width:13px;height:1.5px;background:currentColor}
.f3next i::after{content:'';position:absolute;right:1px;top:2px;width:7px;height:7px;border:solid currentColor;border-width:1.5px 1.5px 0 0;transform:rotate(45deg)}
.f3next.close i{display:none}
.f3next[hidden],.f3skip[hidden]{display:none}
.f3next.in{animation:f3rise .7s cubic-bezier(.2,.7,.2,1) both}
.f3skip{position:absolute;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(38px + env(safe-area-inset-bottom,0px));border:0;background:none;color:rgba(255,255,255,.4);font-size:13px;padding:6px 4px;cursor:pointer}
.f3skip:hover{color:rgba(255,255,255,.7)}
@media (max-width:699px){
  .f3cap{left:18px;top:calc(16px + env(safe-area-inset-top,0px));flex-direction:column;gap:2px}
  .f3stage{right:18px;top:calc(16px + env(safe-area-inset-top,0px))}
  .f3side{left:14px;right:14px;width:auto;top:auto;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-height:44vh;justify-content:flex-end}
  .f3side:has(.f3final){top:calc(64px + env(safe-area-inset-top,0px));max-height:none}
  .f3p header{padding:14px 16px 10px}
  .f3names{padding:6px 16px}
  .f3card{left:20px;bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .f3skip{right:18px;bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  .f3bot{justify-content:flex-start;padding-left:18px}
}
.f3q h1{font-size:clamp(56px,10vw,110px);font-weight:500;letter-spacing:-.04em}
.f3q small{font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.4)}
</style></head><body><div class="demo"><h1>최종 결과 공개 연출 예시</h1><p>이름과 점수는 모두 예시입니다.<br>실제 앱에서는 방장이 승인하면 이 연출로 공개됩니다.</p><button id="go">연출 보기</button></div>
<script>/* ---------- v96: 최종 결과 3D 공개 연출 (FR3). 차분하고 깔끔한 무대: 반사되는 어두운 바닥, 부드러운 그림자, 둥근 기둥, 실제 조명만(눈에 보이는 빔·번쩍임·흔들림 없음).
   three.js r128과 Pretendard 글꼴은 열 때만 불러옴(같은 사이트 vendor/, three는 안 되면 cdnjs).
   FR3.play(data, {onClose, onFail, onReplay, manual}) data={title, period, cut, people:[{name,total,me}](점수 높은 순), prizes:['1등 상품','2등','3등']}
   막: 0 멀리서 곡선으로 다가옴 -> 1 기둥이 솟고 100점 선 -> 2 마지막 등수부터 4등까지 -> 3·4·5 세 사람 중 3·2·1등이 곡선으로 시상대에 -> 6 전체 순위 ---------- */
var FR3=(function(){
  var SRC=['vendor/three-r128.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'];
  var FONT_URL='vendor/PretendardVariable.woff2';
  var FF='"FR3 Pretendard","Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif';
  function loadThree(cb){
    if(window.THREE)return cb(true);
    var i=0;
    (function next(){
      if(i>=SRC.length)return cb(false);
      var s=document.createElement('script'),done=false;
      var to=setTimeout(function(){if(done)return;done=true;try{s.parentNode.removeChild(s);}catch(e){}next();},12000);
      s.onload=function(){if(done)return;done=true;clearTimeout(to);if(window.THREE)cb(true);else next();};
      s.onerror=function(){if(done)return;done=true;clearTimeout(to);try{s.parentNode.removeChild(s);}catch(e){}next();};
      s.src=SRC[i++];s.async=true;document.head.appendChild(s);
    })();
  }
  var fontP=null;
  function loadFont(){
    if(fontP)return fontP;
    fontP=new Promise(function(res){
      try{
        if(!window.FontFace||!document.fonts)return res(false);
        var f=new FontFace('FR3 Pretendard','url('+FONT_URL+') format("woff2")',{weight:'45 920',display:'swap'});
        var t=setTimeout(function(){res(false);},5000);
        f.load().then(function(ff){document.fonts.add(ff);clearTimeout(t);res(true);},function(){clearTimeout(t);res(false);});
      }catch(e){res(false);}
    });
    return fontP;
  }
  function webgl(){try{var c=document.createElement('canvas');return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')));}catch(e){return false;}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmt(n){return Math.round(+n||0).toLocaleString('ko-KR');}
  var E={
    lin:function(t){return t;},
    out:function(t){return 1-Math.pow(1-t,3);},
    out5:function(t){return 1-Math.pow(1-t,5);},
    io:function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;},
    sine:function(t){return -(Math.cos(Math.PI*t)-1)/2;}
  };
  function play(data,opt){
    opt=opt||{};
    var root=document.createElement('div');root.className='f3';root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');root.setAttribute('aria-label','최종 결과 발표');
    root.innerHTML='<div class="f3load"><i></i></div>';
    document.body.appendChild(root);document.documentElement.classList.add('f3on');
    var closed=false;
    function fail(){if(closed)return;closed=true;try{root.parentNode.removeChild(root);}catch(e){}document.documentElement.classList.remove('f3on');if(opt.onFail)opt.onFail();}
    if(!webgl())return fail();
    loadThree(function(ok){
      if(closed)return;
      if(!ok||!window.THREE)return fail();
      loadFont().then(function(){
        if(closed)return;
        try{run(root,data,opt,function(){closed=true;});}catch(e){try{console.error(e);}catch(x){}fail();}
      });
    });
    return {close:function(){if(root._close)root._close();else fail();}};
  }
  function run(root,data,opt,markClosed){
    var T3=window.THREE,L=function(h){return new T3.Color(h).convertSRGBToLinear();},people=(data.people||[]).filter(function(x){return x&&x.total>0;}),N=people.length,CUT=+data.cut||100;
    people.forEach(function(p,i){p.rank=i+1;});
    var W=innerWidth,H=innerHeight,portrait=W<H,mobile=Math.min(W,H)<700,far=portrait?1.55:1;
    root.innerHTML='<canvas class="f3c"></canvas><div class="f3ui"><div class="f3vig"></div><div class="f3cap"><b>'+esc(data.title||'최종 결과')+'</b><span>'+esc(data.period||'')+'</span></div><div class="f3stage"></div><div class="f3hero"></div><div class="f3side"></div><div class="f3card"></div><div class="f3bot"><button class="f3next" hidden><span></span><i aria-hidden="true"></i></button></div><button class="f3skip">건너뛰기</button></div>';
    var q=function(s){return root.querySelector(s);};
    var ui={stage:q('.f3stage'),hero:q('.f3hero'),side:q('.f3side'),card:q('.f3card'),next:q('.f3next'),nextT:q('.f3next span'),skip:q('.f3skip')};
    var R=new T3.WebGLRenderer({canvas:q('.f3c'),antialias:true,powerPreference:'high-performance'});
    R.setPixelRatio(Math.min(devicePixelRatio||1,mobile?1.75:2));R.setSize(W,H);
    R.outputEncoding=T3.sRGBEncoding;R.toneMapping=T3.ACESFilmicToneMapping;R.toneMappingExposure=.92;
    R.shadowMap.enabled=true;R.shadowMap.type=T3.PCFSoftShadowMap;
    var BG=0x0b0c10;
    var scene=new T3.Scene();scene.background=new T3.Color(BG);scene.fog=new T3.Fog(L(BG),34,mobile?110:140);
    var camera=new T3.PerspectiveCamera(portrait?58:40,W/H,0.1,800);
    var cam={pos:new T3.Vector3(0,62,260),look:new T3.Vector3(0,14,-40)};
    /* ---- 반사용 환경: 어두운 방에 부드러운 큰 조명판 몇 개 ---- */
    (function(){
      var es=new T3.Scene();es.background=new T3.Color(0x07080b);
      function panel(w,h,x,y,z,c,i){var m=new T3.Mesh(new T3.PlaneGeometry(w,h),new T3.MeshBasicMaterial({color:new T3.Color(c).multiplyScalar(i),side:T3.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,2,0);es.add(m);}
      panel(30,10,-24,22,18,0xffffff,2.4);panel(18,40,30,14,-8,0xdfe7ff,1.1);panel(40,8,0,30,-30,0xffffff,.8);panel(60,4,0,-6,40,0x8090b0,.4);
      var pm=new T3.PMREMGenerator(R);scene.environment=pm.fromScene(es,0.04).texture;pm.dispose();
    })();
    /* ---- 빛 ---- */
    var hemi=new T3.HemisphereLight(0xe3e9ff,0x0b0c10,.3);scene.add(hemi);
    var key=new T3.DirectionalLight(0xffffff,.95);key.position.set(-26,46,30);key.castShadow=true;
    var Rr=Math.max(13,0.66*N+8),MAXH=portrait?13:15;
    key.shadow.mapSize.set(mobile?1024:2048,mobile?1024:2048);var sc=key.shadow.camera;sc.left=-Rr-12;sc.right=Rr+12;sc.top=Rr+12;sc.bottom=-Rr-12;sc.near=1;sc.far=140;key.shadow.bias=-0.0004;key.shadow.radius=4;
    scene.add(key);scene.add(key.target);
    var rim=new T3.DirectionalLight(0xb9c8ff,.55);rim.position.set(18,20,-40);scene.add(rim);
    var spot=new T3.SpotLight(0xffe6c2,0,70,.38,.9,1.4);spot.position.set(0,34,18);spot.castShadow=true;spot.shadow.mapSize.set(1024,1024);spot.shadow.bias=-0.0006;scene.add(spot);scene.add(spot.target);
    var warm=new T3.PointLight(0xffc98a,0,26,2);warm.position.set(0,3,9);scene.add(warm);
    /* ---- 바닥 ---- */
    var floor=new T3.Mesh(new T3.PlaneGeometry(500,500),new T3.MeshStandardMaterial({color:L(0x111216),roughness:.85,metalness:0,envMapIntensity:.04}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
    (function(){var m=new T3.Mesh(new T3.RingGeometry(Rr+3.95,Rr+4,200,1,Math.PI*.05,Math.PI*.9),new T3.MeshBasicMaterial({color:L(0xffffff),transparent:true,opacity:.07,depthWrite:false}));m.rotation.x=-Math.PI/2;m.rotation.z=Math.PI;m.position.y=.02;scene.add(m);})();
    /* ---- 글자(캔버스) ---- */
    function textSprite(lines,o){
      o=o||{};var c=document.createElement('canvas'),x=c.getContext('2d'),S=2,w=640*S,big=(o.big||54)*S,small=(o.small||34)*S,gap=10*S;
      var h=Math.round(big*1.25+(lines[1]?small*1.3+gap:0)+20*S);c.width=w;c.height=h;
      x.textAlign='center';x.textBaseline='alphabetic';
      x.font=(o.w1||600)+' '+big+'px '+FF;
      var y=big*1.02+8*S;
      if(o.pre){var pw=x.measureText(o.pre+'  ').width,nw=x.measureText(lines[0]).width,st=(w-(pw+nw))/2;x.textAlign='left';x.fillStyle=o.preCol||'rgba(255,255,255,.45)';x.fillText(o.pre,st,y);x.fillStyle=o.col||'#fff';x.fillText(lines[0],st+pw,y);x.textAlign='center';}
      else{x.fillStyle=o.col||'#ffffff';x.fillText(lines[0],w/2,y,w-40*S);}
      if(lines[1]){x.font='500 '+small+'px '+FF;x.fillStyle=o.col2||'rgba(255,255,255,.55)';x.fillText(lines[1],w/2,y+gap+small*1.15);}
      var t=new T3.CanvasTexture(c);t.encoding=T3.sRGBEncoding;t.anisotropy=8;t.minFilter=T3.LinearMipmapLinearFilter;
      var m=new T3.SpriteMaterial({map:t,transparent:true,depthWrite:false,opacity:0,fog:false});
      var s=new T3.Sprite(m);var k=o.scale||3;s.scale.set(k,k*h/w,1);s.userData={k:k,ar:h/w};s.renderOrder=10;return s;
    }
    /* ---- 기둥 ---- */
    var maxS=Math.max.apply(null,people.map(function(p){return p.total;}).concat([1]));
    function hOf(s){return .5+MAXH*s/maxS;}
    var hCut=CUT<=maxS?hOf(CUT):null,capH=Math.max(hCut?hCut+1.2:0,MAXH*.45);
    var order=people.slice();(function(){var seed=97;for(var i=order.length-1;i>0;i--){seed=(seed*9301+49297)%233280;var j=Math.floor(seed/233280*(i+1)),t=order[i];order[i]=order[j];order[j]=t;}})();
    var span=Math.min(Math.PI*1.05,Math.max(Math.PI*.55,N*0.15)),bars=[];
