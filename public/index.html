.bpb{height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden;margin-top:4px}
.bpb i{display:block;height:100%;background:var(--tc)}
.tag.tt-b{color:var(--tb);background:color-mix(in srgb,var(--tb) 14%,transparent)}
.tag.tt-s{color:var(--ts);background:color-mix(in srgb,var(--ts) 16%,transparent)}
.tag.tt-g{color:var(--tg);background:color-mix(in srgb,var(--tg) 16%,transparent)}
.tag.tt-l{color:var(--tl);background:color-mix(in srgb,var(--tl) 14%,transparent)}
.tag.wb{color:var(--accent-ink);background:var(--accent-soft)}
/* 최종 결과 */
.fincd{display:flex;align-items:center;gap:16px;padding:6px 0 4px}
.fincd b{font-size:40px;line-height:1;font-weight:800;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.fincd span{font-size:14px;color:var(--ink-2)}
.finme{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--fill)}
.finme small{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.finbk{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.finbk b{margin-left:auto;font-size:18px;color:var(--ink)}
.finbk b small{font-size:12px;font-weight:500;margin-left:2px;color:var(--ink-3)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px;margin:6px 0 14px}
.pd{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 12px;border-radius:16px;background:var(--fill);text-align:center;min-width:0}
.pd b{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd small{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pd .pdn{position:absolute;top:8px;left:10px;font-size:13px;font-weight:800;color:var(--ink-3)}
.pd.p1{padding-top:26px;background:color-mix(in srgb,var(--tg) 16%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tg) 50%,transparent)}
.pd.p1 .pdn{color:var(--tg)}
.pd.p2{background:color-mix(in srgb,var(--ts) 14%,var(--surface))}
.pd.p3{background:color-mix(in srgb,var(--tb) 12%,var(--surface))}
.pd .tag{white-space:normal;margin-top:4px}
.fr2 .finbk{margin-top:4px}
.finpen{margin-top:14px;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--red) 8%,var(--surface));display:grid;gap:8px;justify-items:start}
.finpen small{display:block;font-size:12px;color:var(--ink-3)}
.finpen b{font-size:16px}
.wkres{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ct + .wkres{border-top:0}
.wkn b{display:block;font-size:14px}
.wkn small{font-size:12px;color:var(--ink-3)}
.wkw{display:flex;flex-wrap:wrap;gap:6px}
.ww{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--ink-2);font-variant-numeric:tabular-nums}
.ww.p1{background:color-mix(in srgb,var(--tg) 18%,var(--surface))}
.prz{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--tg) 12%,var(--surface));display:grid;gap:2px}
.prz small{font-size:12px;color:var(--ink-3)}
.prz b{font-size:16px}
.pby{margin-left:8px;font-size:12px;color:var(--ink-3)}
/* 단원별 진도 */
.ustack{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));align-items:start}
.ustack > .card{margin:0}
.usum,#c-tbl{grid-column:1/-1}
.usumrow{display:flex;align-items:center;gap:18px}
.usumrow small{display:block;font-size:12px;color:var(--ink-3)}
.usumrow b{font-size:34px;line-height:1.1;font-weight:800;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.usumrow .hint{flex:1;min-width:0}
.usub .ct h2{display:flex;align-items:center;gap:8px}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sc)}
.upct{font-size:18px;font-variant-numeric:tabular-nums}
.ubar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:2px 0 6px}
.ubar i{display:block;height:100%;background:var(--sc);transition:width .4s var(--ease)}
.urow{display:grid;gap:7px;padding:10px 0;border-top:1px solid var(--line)}
.ubar + .urow{border-top:0}
.un{display:flex;align-items:baseline;gap:8px;min-width:0}
.un b{font-size:14.5px;overflow-wrap:anywhere}
.un small{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.urow.full .un b{color:var(--sc)}
.uchks{display:flex;flex-wrap:wrap;gap:6px}
.uck{border:0;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;background:var(--fill);color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s}
.uck.on{background:var(--sc);color:#fff}
.uedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.uadd{display:flex;gap:8px;margin-top:12px}
.uadd input{flex:1;min-width:0}
.ufoot{margin-top:10px;gap:6px;flex-wrap:wrap}
.obar{display:block;height:3px;border-radius:2px;background:var(--fill);margin:3px auto 0;width:70%;overflow:hidden}
.obar i{display:block;height:100%;background:var(--accent)}
.ounits{display:grid;gap:8px;padding:10px 4px 14px;border-top:1px solid var(--line)}
.oup{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:start}
.oup b{font-size:13px}
.oup span{display:flex;flex-wrap:wrap;gap:4px}
.ut{font-style:normal;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--ink-2)}
.ut.full{background:var(--accent-soft);color:var(--accent-ink)}
.seg.mini.pmode,.seg.mini.upf{flex:none;width:auto;margin:0;min-width:0;grid-template-columns:none}
.seg.mini.pmode button,.seg.mini.upf button{padding:0 12px;white-space:nowrap}
.seg.mini.upf button{height:28px;font-size:12.5px;padding:0 9px}
.fincd b{flex:none;white-space:nowrap}
.finbk b{white-space:nowrap}
.finme .finbk b small{display:inline;margin:0 0 0 2px}
#c-setup .row input{min-width:0}
#c-setup .lb{margin-top:0}
.serr{color:var(--red);margin-top:8px}
.sh{font-size:15px;font-weight:700;margin-bottom:6px}
.rules{margin:10px 0;padding:12px 14px;border-radius:12px;background:var(--fill);font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow-x:auto;-webkit-user-select:all;user-select:all}
.invite{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--fill)}
.invite small{display:block;font-size:12px;color:var(--ink-3);margin-bottom:2px}
.invite .url{font-size:13px;word-break:break-all;-webkit-user-select:all;user-select:all;color:var(--ink-2)}
.jcode{font:700 30px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace !important;letter-spacing:.32em;text-align:center;padding:14px 10px !important;font-variant-numeric:tabular-nums}
.jcode::placeholder{color:var(--ink-3);opacity:.45}
.jcode.sm{font-size:18px !important;letter-spacing:.18em;padding:10px !important}
#c-joincode{display:flex;flex-direction:column;gap:10px}
#c-joincode .btn{width:100%}
.gaterm{font-size:13px;font-weight:700;color:var(--accent-ink);margin-bottom:4px}
.rmbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rmbox>div{min-width:0;padding:10px 12px;border-radius:12px;background:var(--fill)}
.rmbox small,.invbig small{display:block;font-size:12px;color:var(--ink-3);margin-bottom:2px}
.rmbox b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmcode{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.invbig{margin:0 0 14px;padding:16px 12px;border-radius:14px;background:var(--accent-soft);text-align:center}
.invbig b{display:block;font:800 36px/1.15 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.invsteps{margin:0 0 12px;padding-left:20px;font-size:14px;color:var(--ink-2);display:grid;gap:4px}
.invmsg{margin:0;padding:10px 12px;border-radius:12px;background:var(--fill);font:12.5px/1.55 inherit;font-family:inherit;white-space:pre-wrap;word-break:break-all;-webkit-user-select:all;user-select:all;color:var(--ink-2)}
.rmlist{display:grid;gap:8px}
.rmrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 12px;border-radius:12px;background:var(--fill)}
.rmrow.on{background:var(--accent-soft)}
.rmn{flex:1;min-width:120px}
.rmn b{display:block;font-size:15px}
.rmn small{font-size:12px;color:var(--ink-3)}
#c-newroom .lb:first-of-type{margin-top:0}
.a2steps{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:12px}
.a2steps li{display:grid;grid-template-columns:24px auto minmax(0,1fr);gap:12px;align-items:center;font-size:15.5px;line-height:1.45}
.a2steps b{color:var(--accent-ink)}
.a2n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.a2ic{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:46px;height:46px;padding:0 11px;border-radius:13px;background:#2C2C2E;color:#F5F5F7;font-size:14px;font-weight:600;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.a2ic svg{width:24px;height:24px;flex:none}
.a2ic.row{justify-content:flex-start;padding:0 13px 0 11px}
.a2ic.pill{color:#3B95FF;font-size:15px}
.a2ic.mono{color:#F5F5F7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;font-size:13px}
.a2ic.circ{flex-direction:column;gap:3px;height:auto;padding:6px 8px 5px;background:#1C1C1E}
.a2ic.circ .a2c{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#3A3A3C}
.a2ic.circ .a2c svg{width:20px;height:20px}
.a2ic.circ small{font-size:10.5px;font-weight:500;color:#D1D1D6}
.a2t{min-width:0}
.jinapp{margin:0;font-size:13.5px}
.jcode.sm::placeholder{letter-spacing:normal;font:500 15px/1.2 var(--font-body)}
.rmsec{border-top:0;padding-top:0}
.nrchk{display:flex;align-items:center;gap:10px;margin-top:12px;padding:4px 0;border:0;background:none;font-size:14px;color:var(--ink-2);cursor:pointer;text-align:left}
.nrchk i{position:relative;flex:none;width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--line);transition:background .15s,box-shadow .15s}
.nrchk[aria-pressed="true"] i{background:var(--accent);box-shadow:none}
.nrchk[aria-pressed="true"] i::after{content:'';position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}

  Object.keys(V.quiz).forEach(function(id){var q=obj(V.quiz[id]);if(q.mid&&q.at&&q.kind!=='ask'&&q.kind!=='lapse')posts[q.mid+'_'+fd(new Date(+q.at))]=1;});

      var x=obj(V.days[m.id+'_'+d]),g=arr(x.goals),done=g.filter(isDone).length,tm=sumMins(x.mins),mm=sumMins(x.manual),hk=Object.keys(helps[m.id+'_'+d]||{}).length;
      streak=x.in?streak+1:0;

        time:Math.min(RULE.timeMax,Math.floor((tm+Math.min(mm,RULE.manualMax))/30)*RULE.per30),cert:x.certAt?(isLate(V,d,x.certAt)?RULE.certLate:RULE.certOn):0,
        quiz:(posts[m.id+'_'+d]?RULE.quiz:0)+RULE.help*Math.min(RULE.helpMax,hk),bonus:0,place:0,done:done,n:g.length,mins:tm+mm,certed:!!x.certAt};
      r.base=r.att+r.goal+r.clear+r.time+r.cert+r.quiz;r.cut=!!(rd&&d<rd);r.off=(rd&&d===rd)?Math.min(off,r.base):0;r.base-=r.off;r.total=r.base;sc[m.id][d]=r;
    }

  for(var d=START;d<t&&d<=END;d=addDays(d,1)){
    var rows=V.roster.map(function(m){return sc[m.id][d];}).filter(function(r){return r&&r.base>0;}).sort(function(a,b){return b.base-a.base;});

/* ---------- 저장 ---------- */
function save(path,data){
  if(!canWrite())return;
  data=guardDay(path,data);
  if(BQ.has[path]){O[path]=data;if(BQ.list.indexOf(path)<0)BQ.list.push(path);if(!BQ.busy)bqRun();return;}
  O[path]=data;
  var w=W[path]||(W[path]={busy:false,has:false,next:null});
  w.next=data;w.has=true;
  if(!w.busy)pump(path);
}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
var BQ={list:[],has:{},busy:false};
function queueWrite(path,data){
  if(!canWrite())return;
  data=guardDay(path,data);
  if(W[path]&&W[path].busy){save(path,data);return;}
  O[path]=data;BQ.has[path]=1;if(BQ.list.indexOf(path)<0)BQ.list.push(path);
  if(!BQ.busy)bqRun();
}
async function bqRun(){
  BQ.busy=true;
  while(BQ.list.length){
    var path=BQ.list.shift();
    if(!Object.prototype.hasOwnProperty.call(O,path)){delete BQ.has[path];continue;}
    var d=O[path],tries=0,ok=false,code=null;
    for(;;){
      try{await S.net.write(path,d);ok=true;break;}
      catch(e){code=e&&e.code;if((code==='resource_exhausted'||code==='unavailable'||!code)&&tries<4){tries++;await wait(500*tries+Math.random()*400);continue;}break;}
    }
    if(ok){if(O[path]===d)commit(path,d);}
    else{writeFailed(code);if(O[path]===d)delete O[path];}
    if(BQ.list.indexOf(path)<0)delete BQ.has[path];
  }
  BQ.busy=false;render();
}
async function pump(path){
  var w=W[path];w.busy=true;var ok=true,last;
  while(w.has){
    var d=w.next;w.has=false;
    try{await S.net.write(path,d);last=d;}
    catch(e){
      var code=e&&e.code;
      if(code==='unavailable'||!code){
        try{await wait(500+Math.random()*900);await S.net.write(path,d);last=d;continue;}catch(e2){code=e2&&e2.code;}
      }
      ok=false;writeFailed(code);break;
    }
  }
  w.busy=false;
  if(ok){commit(path,last);}else{w.has=false;delete O[path];}
  render();
}
function commit(path,d){
  var i=path.indexOf('/'),c=path.slice(0,i),id=path.slice(i+1);
  if(c==='meta'){S.config=d;}
  else{var m=Object.assign({},S[c]);if(d===null)delete m[id];else m[id]=d;S[c]=m;}
  delete O[path];
}
function writeFailed(code){
  if(code==='invalid_argument'||code==='not_granted'||code==='revoked'||code==='capability_disabled'||code==='capability_removed'){S.readOnly=true;}
  else if(code==='quota_exceeded'){flash('저장 공간이 가득 찼습니다. 오래된 글을 지운 뒤 다시 시도하세요.');}
  else{flash('저장하지 못했습니다. 잠시 후 다시 눌러주세요.');}
}

function hashPin(pin,mid,salt){
  var str=pin+':'+mid+':'+salt,h1=0xdeadbeef,h2=0x41c6ce57;

var GMAX=12;
function plText(type,unit,note,amt){

function planList(V){
  if(V._pl)return V._pl;
  if(!V.me)return V._pl=[];
  var parts={},t=today(),pre=V.me+'_';
  Object.keys(V.days).forEach(function(k){
    if(k.indexOf(pre)!==0)return;var date=k.slice(pre.length);
    arr(obj(V.days[k]).goals).forEach(function(g){if(g&&g.pid&&!g.mv)(parts[g.pid]=parts[g.pid]||[]).push({date:date,id:g.id,done:!!g.done,part:g.part||'',amt:+g.amt||0,text:String(g.text||'')});});
  });

    p.parts=ps;p.n=ps.length;p.dn=ps.filter(function(x){return x.done;}).length;
    p.late=ps.filter(function(x){return !x.done&&x.date<t;}).length;
    p.todayPart=ps.filter(function(x){return x.date===t;})[0]||null;
    p.finished=p.n>0&&p.dn===p.n;
    p.amtDone=ps.reduce(function(s2,x){return s2+(x.done?x.amt:0);},0);
    p.label=p.mode==='repeat'?plText(p.type,p.unit,p.note,0)+(p.per>0?', 매일 '+p.per+(p.unit||'문제'):', 매일'):plText(p.type,p.unit,p.note,+p.total||0);

function dueMap(V){if(V._dm)return V._dm;var m={};planList(V).forEach(function(p){if(!p.finished)(m[p.due]=m[p.due]||[]).push(p);});return V._dm=m;}
function ddayLabel(d){var n=diffDays(today(),d);return n===0?'오늘 마감':n<0?'마감 지남':'D-'+n;}
function plDows(pl){var s2=String(pl.dows||'1111111');return [0,1,2,3,4,5,6].map(function(i){return s2.charAt(i)!=='0';});}
function plDates(pl){
  var t=today(),out=[];if(!pl.due)return out;

function plAlloc(V,pl){
  var off=obj(pl.off),rows=plDates(pl).map(function(d){return {d:d,full:dayOf(V,V.me,d).goals.length>=GMAX,off:!!off[d],amt:0};});
  var use=rows.filter(function(r){return !r.full&&!r.off;}),n=use.length,tot=Math.max(0,+pl.total||0);

    if(tot>=n){var base=Math.floor(tot/n),rem=tot-base*n;use.forEach(function(r,i){r.amt=base+(i<rem?1:0);});}
    else{for(var i=0;i<tot;i++)use[Math.floor(i*n/tot)].amt+=1;}
    use=use.filter(function(r){if(!r.amt)r.rest=true;return r.amt>0;});

function stripPlan(p){var o={};['mid','sid','type','unit','note','mode','total','per','due','start','dows','early','at'].forEach(function(k){if(p[k]!==undefined)o[k]=p[k];});return o;}

/* 남은 몫을 다시 배분 (마감을 바꿀 때도 사용) */
function redoPlan(p,due){
  var t=today();due=due||p.due;
  if(due!==p.due)queueWrite('plans/'+p.id,Object.assign(stripPlan(p),{due:due}));
  if(p.mode==='once'){var x=p.parts.filter(function(q){return !q.done;})[0];if(x&&x.date!==due&&due>=t)moveGoal(x.date,x.id,due,true);return 1;}
  var left=p.mode==='split'?(+p.total>0?Math.max(0,+p.total-p.amtDone):p.parts.filter(function(q){return !q.done;}).length):1;
  if(p.mode==='split'&&left<=0)return 0;
  dropPlanGoals({parts:p.parts.filter(function(q){return p.mode==='split'||q.date>=t;})},true);
  var st=p.parts.some(function(q){return q.done&&q.date===t;})?addDays(t,1):t;
  var spec=Object.assign({},p,{due:due,start:p.start>st?p.start:st,off:{},total:p.mode==='split'?left:p.total});

function ttCommit(kind,from,id,s,e,to){
  var V=view();S.ttPick=null;
  if(!V.me||!need()){render();return;}
  if(kind==='f'){
    var b=fixedOn(V,from).filter(function(x){return x.id===id;})[0];if(!b){render();return;}
    var sn=snap(['progress/'+V.me]);
    editTT(function(T){if(b.one)T.x[from]=arr(T.x[from]).map(function(x){return x.id===id?Object.assign({},x,{s:s,e:e}):x;});else{var o=obj(T.ov[from]);o[id]={s:s,e:e};T.ov[from]=o;}});
    if(b.tpl)flash(jos(b.t||TTK[b.k],'을','를')+' 이 날만 '+fmtHM(s)+'~'+fmtHM(e)+'에 두었습니다.',sn);
    render();return;
  }
  var g=dayOf(V,V.me,from).goals.filter(function(x){return x.id===id;})[0];if(!g){render();return;}
  if(to!==from){
    if(to<today()){flash('지난 날로는 옮길 수 없습니다.');render();return;}
    if(dayOf(V,V.me,to).goals.length>=GMAX){flash(shortDate(to)+'에는 할 일이 가득 찼습니다.');render();return;}
    var sn2=snap(['days/'+V.me+'_'+from,'days/'+V.me+'_'+to]);
    editDay(from,function(d){d.goals=d.goals.filter(function(x){return x.id!==id;});if(d.focus===id)d.focus=null;});
    editDay(to,function(d){var c=clone(g);c.done=false;c.ts=s;c.te=e;d.goals.push(c);});
    flash(shortDate(to)+' '+DOW[pd(to).getDay()]+'요일 '+fmtHM(s)+'에 옮겨 놓았습니다.',sn2);render();return;
  }
  editDay(from,function(d){d.goals.forEach(function(x){if(x.id===id){x.ts=s;x.te=e;}});});
  render();
}
function ttFill(){
  var V=view();if(!V.me||!need())return;
  var t=today(),win=ttWin(V),nm=nowMin(),paths=[],plan=[],left=0,n=0;
  ttDays().filter(function(d){return d>=t;}).forEach(function(d){
    var day=dayOf(V,V.me,d),un=day.goals.filter(function(g){return !placed(g)&&!g.done&&!g.mv;});if(!un.length)return;
    var busy=fixedOn(V,d).map(function(b){return [b.s,b.e];}).concat(day.goals.filter(placed).map(function(g){return [+g.ts,+g.te];}));
    var cur=win.s,set={},k=0;if(d===t)cur=Math.max(cur,Math.ceil((nm+5)/10)*10);
    un.forEach(function(g){
      var dur=60,s=cur;
      for(var guard=0;guard<100;guard++){
        if(s+dur>win.e){s=null;break;}
        var hit=null;busy.forEach(function(b){if(s<b[1]&&s+dur>b[0]&&(!hit||b[1]>hit[1]))hit=b;});
        if(!hit)break;s=hit[1];
      }
      if(s==null){left++;return;}
      set[g.id]=[s,s+dur];busy.push([s,s+dur]);cur=s+dur+10;k++;
    });
    if(k){paths.push('days/'+V.me+'_'+d);plan.push([d,set]);}
  });
  if(!plan.length){flash(left?'빈 시간이 모자라 넣지 못했습니다. 공부 시간 범위나 고정 일정을 확인하세요.':'시간표에 넣을 할 일이 없습니다.');return;}
  var sn=snap(paths);
  plan.forEach(function(p){editDay(p[0],function(d){d.goals.forEach(function(x){var v=p[1][x.id];if(v){x.ts=v[0];x.te=v[1];n++;}});});});
  flash('할 일 '+n+'개를 빈 시간에 넣었습니다.'+(left?' '+left+'개는 시간이 모자라 남겨 뒀습니다.':''),sn);
}

/* ---------- 확인 필요: 지울 시간 계산 ---------- */
function flagPlan(V,f){
  var sid=f.sid,out={},tot=0;
  if(f.cd&&typeof f.cd==='object'){
    Object.keys(f.cd).forEach(function(d){var want=Math.max(0,+f.cd[d]||0),have=+dayOf(V,f.mid,d).mins[sid]||0,n=Math.min(want,have);if(n>0){out[d]=n;tot+=n;}});
    return {d:out,total:tot};
  }
  var left=Math.min(300,Math.max(0,Math.round((+f.end-(+f.start))/60000))),ds=[fd(new Date(+f.end)),fd(new Date(+f.start))];
  ds.forEach(function(d){if(left<=0||out[d]!=null)return;var have=+dayOf(V,f.mid,d).mins[sid]||0,n=Math.min(left,have);if(n>0){out[d]=n;tot+=n;left-=n;}});
  return {d:out,total:tot};
}

var WD=null;

function wkMove(from,id,to,beforeId){
  var V=view(),t=today();if(!V.me||!need())return;
  var g=dayOf(V,V.me,from).goals.filter(function(x){return x.id===id;})[0];if(!g)return;
  function put(list,item){var j=beforeId?list.map(function(x){return x.id;}).indexOf(beforeId):-1;if(j<0)list.push(item);else list.splice(j,0,item);}
  if(from===to){
    editDay(from,function(d){var i=d.goals.map(function(x){return x.id;}).indexOf(id);if(i<0)return;var it=d.goals.splice(i,1)[0];put(d.goals,it);});
    return;
  }
  if(to<t){flash('지난 날로는 옮길 수 없습니다.');return;}
  if(dayOf(V,V.me,to).goals.length>=GMAX){flash(shortDate(to)+'에는 할 일이 가득 찼습니다.');return;}
  var sn=snap(['days/'+V.me+'_'+from,'days/'+V.me+'_'+to]);
  editDay(from,function(d){d.goals=d.goals.filter(function(x){return x.id!==id;});if(d.focus===id)d.focus=null;});
  editDay(to,function(d){var c=clone(g);c.done=false;delete c.ts;delete c.te;put(d.goals,c);});
  flash(shortDate(to)+' '+DOW[pd(to).getDay()]+'요일로 옮겼습니다.',sn);
}

var WD_DWELL=520;
function wdCanFlip(dir){
  var ws=S.alWeek,nw=alClamp(addDays(ws,7*dir));
  if(nw===ws)return false;
  if(dir<0&&addDays(nw,6)<today())return false;
  return true;
}
function wdEdges(){

    var e=document.createElement('div');e.className='wkedge '+(dir>0?'r':'l');e.setAttribute('aria-hidden','true');
    e.innerHTML=dir>0?'<span>다음 주</span><b>&rsaquo;</b>':'<b>&lsaquo;</b><span>이전 주</span>';
    document.body.appendChild(e);WD.edges[dir]=e;
  });

function wdEdgeUpdate(){
  if(!WD||!WD.edges)return;
  var sc=WD.sc||document.querySelector('.wkscroll'),W=window.innerWidth||1000,H=window.innerHeight||800;
  [-1,1].forEach(function(dir){
    var e=WD.edges[dir],show=false,r=null;
    if(sc&&document.body.contains(sc)&&wdCanFlip(dir)){
      var b=sc.getBoundingClientRect(),can=sc.scrollWidth>sc.clientWidth+2;
      var atEnd=!can||(dir>0?sc.scrollLeft+sc.clientWidth>=sc.scrollWidth-2:sc.scrollLeft<=1);
      var top=Math.max(b.top,8),bot=Math.min(b.bottom,H-8);
      if(atEnd&&bot-top>40){
        if(bot-top<140){var mid=(top+bot)/2;top=Math.max(8,mid-70);bot=Math.min(H-8,mid+70);}
        var left=dir>0?Math.min(b.right,W)-44:Math.max(b.left,0);
        r={l:left,t:top,r:left+44,b:bot};show=true;
      }
    }
    WD.er[dir]=r;
    if(show){e.style.left=r.l+'px';e.style.top=r.t+'px';e.style.height=(r.b-r.t)+'px';}
    if(e.classList.contains('on')!==show)e.classList.toggle('on',show);
    if(!show)e.classList.remove('arm');
  });
}
function wdInEdge(){
  if(!WD||!WD.er)return 0;

  return 0;
}
function wdFlip(dir){
  var ow=S.alWeek,nw=alClamp(addDays(ow,7*dir));if(nw===ow)return;
  if(WD.ph&&WD.ph.parentNode)WD.ph.remove();
  var prev=document.querySelector('.wkc.over');if(prev)prev.classList.remove('over');

function lapseFrames(file,onProg){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),v=document.createElement('video'),done=false,cv=document.createElement('canvas'),cx=cv.getContext('2d'),out=[],q=.58,n=LAPSE_N,dur=0,W=0,H=0;
    v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.preload='auto';
    function fin(err){if(done)return;done=true;try{URL.revokeObjectURL(url);}catch(e){}v.removeAttribute('src');try{v.load();}catch(e){}if(err)rej(err);else res({frames:out,w:W,h:H,dur:dur});}
    function waitEv(name,ms){return new Promise(function(ok,no){var t=setTimeout(function(){v.removeEventListener(name,h);no(new Error('timeout'));},ms);function h(){clearTimeout(t);v.removeEventListener(name,h);ok();}v.addEventListener(name,h);});}
    v.addEventListener('error',function(){fin(new Error('decode'));});
    v.src=url;
    waitEv('loadedmetadata',20000).then(function(){
      dur=v.duration;if(!isFinite(dur)||dur<=0)throw new Error('duration');
      var vw=v.videoWidth||0,vh=v.videoHeight||0;if(!vw||!vh)throw new Error('size');
      var sc=Math.min(1,LAPSE_LONG/Math.max(vw,vh));W=Math.max(2,Math.round(vw*sc/2)*2);H=Math.max(2,Math.round(vh*sc/2)*2);cv.width=W;cv.height=H;
      n=dur<6?Math.max(8,Math.min(LAPSE_N,Math.round(dur*8))):LAPSE_N;
      var p=Promise.resolve();try{var pl=v.play();if(pl&&pl.then)p=pl.then(function(){v.pause();}).catch(function(){});}catch(e){}
      return p;
    }).then(function(){
      var i=0;
      function step(){
        if(done)return;
        if(i>=n){fin();return;}
        var t=Math.min(Math.max(0,dur-0.05),dur*(i+0.5)/n);
        var w=waitEv('seeked',10000);v.currentTime=t;

          out.push(d);i++;if(onProg)onProg(i,n);

}

function weekResults(V){
  if(V._wr)return V._wr;
  var t=today(),out=[];
  for(var w=START;w<=END&&w<=t;w=addDays(w,7)){
    var e=addDays(w,6);if(e>END)e=END;
    var done=t>e,st=standings(V,w,e),rows=[],place=0,prev=null;
    st.forEach(function(x,i){if(x.total!==prev){place=i+1;prev=x.total;}if(place<=3&&x.total>0&&st.length>1)rows.push({p:x.p,place:place,total:x.total,bonus:done?WEEK_BONUS[place-1]:0});});

  return V._wr=out;
}

/* ---------- 방: 참여 코드, 새 방, 방 바꾸기 (웹 판) ---------- */
// 참여 링크: 사이트주소#join=<저장소 이름>  -> 참여 코드 6자리 -> 이름 고르기
// 코드 연결: rooms/joincode-<코드> = {r:방 id, n:방 이름, at}
// 방 정보:   rooms/<방>/d/meta/room = {name, code, at}
var JOIN_LEN=6;
function siteBase(){return String(location.href).split('#')[0];}
function dbToken(url){
  url=String(url||'');
  var m=/^https:\/\/([a-z0-9-]+)-default-rtdb\.([a-z0-9-]+)\.firebasedatabase\.app$/i.exec(url);if(m)return m[1]+'.'+m[2];
  m=/^https:\/\/([a-z0-9-]+)-default-rtdb\.firebaseio\.com$/i.exec(url);if(m)return m[1];
  return encodeURIComponent(url);
}
function dbFromToken(t){
  t=String(t||'');
  if(/^https/i.test(t)){try{t=decodeURIComponent(t);}catch(e){}t=t.replace(/\/+$/,'');return /^https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/i.test(t)?t:'';}
  if(/^[a-z0-9-]+\.[a-z0-9-]+$/i.test(t)){var p=t.split('.');return 'https://'+p[0]+'-default-rtdb.'+p[1]+'.firebasedatabase.app';}
  if(/^[a-z0-9-]+$/i.test(t))return 'https://'+t+'-default-rtdb.firebaseio.com';
  return '';
}
function joinLink(url){return siteBase()+'#join='+dbToken(url);}
function fmtCode(c){c=String(c||'');return c.length===6?c.slice(0,3)+' '+c.slice(3):c;}
function roomsList(){var a=[];try{a=JSON.parse(lsGet('gbb_rooms')||'[]');}catch(e){}return Array.isArray(a)?a.filter(function(x){return x&&x.url&&x.room;}):[];}
function roomsSave(a){lsSet('gbb_rooms',JSON.stringify(a.slice(0,12)));}
function roomEntry(r){return r?roomsList().filter(function(x){return x.url===r.url&&x.room===r.room;})[0]||null:null;}
function roomsRemember(e){
  var a=roomsList(),i=-1;a.forEach(function(x,j){if(x.url===e.url&&x.room===e.room)i=j;});
  if(i<0){a.unshift({url:e.url,room:e.room,name:e.name||'',code:e.code||''});roomsSave(a);return;}
  var x=a[i],ch=false;
  if(e.name&&x.name!==e.name){x.name=e.name;ch=true;}
  if(e.code&&x.code!==e.code){x.code=e.code;ch=true;}
  if(ch)roomsSave(a);
}
function fbRaw(url,path,method,data){
  return fetch(url.replace(/\/+$/,'')+'/rooms/'+path+'.json',{method:method||'GET',headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();});
}
function codeLookup(url,code){return fbRaw(url,'joincode-'+code);}
function newCode(url){
  var n=0;
  function one(){
    var b=new Uint32Array(1);try{crypto.getRandomValues(b);}catch(e){b[0]=Math.floor(Math.random()*4294967295);}
    var c=String(100000+b[0]%900000);
    return codeLookup(url,c).then(function(m){if(!m)return c;if(++n>=6)throw new Error('busy');return one();});
  }
  return one();
}
function goRoom(e){
  roomsRemember(e);
  lsSet('gbb_remote',JSON.stringify({url:e.url,room:e.room}));
  try{history.replaceState(null,'',siteBase()+'#j='+dbToken(e.url));}catch(x){}
  location.reload();
}
function syncAddr(){
  if(!S.remote)return;
  var ri=S.roomInfo||{},e=roomEntry(S.remote),code=ri.code||(e&&e.code);
  var want=code?siteBase()+'#j='+dbToken(S.remote.url):inviteLink(S.remote);
  if(String(location.href)!==want){try{history.replaceState(null,'',want);}catch(x){}}
}
function makeCode(re){
  if(!S.remote||!S.net||S.net.mode!=='firebase')return;
  var url=S.remote.url,room=S.remote.room,old=(S.roomInfo||{}).code||'';
  return newCode(url).then(function(code){
    return S.net.read('meta/room').then(function(cur){
      cur=obj(cur);
      if(!re&&cur.code)return;
      var name=String(cur.name||(S.roomInfo||{}).name||'공부방'),now=Date.now();
      return fbRaw(url,'joincode-'+code,'PUT',{r:room,n:name,at:now}).then(function(){
        var ni={name:name,code:code,at:now};
        return S.net.write('meta/room',ni).then(function(){
          S.roomInfo=ni;
          if(re&&old&&old!==code)fbRaw(url,'joincode-'+old,'DELETE').catch(function(){});
          roomTick();
          if(re)flash('참여 코드를 '+fmtCode(code)+'(으)로 바꿨습니다.');
          render();
        });
      });
    });
  }).catch(function(){if(re){flash('코드를 바꾸지 못했습니다. 인터넷 연결을 확인해 주세요.');render();}});
}
function roomTick(){
  if(!S.remote||!S.net||S.net.mode!=='firebase')return;
  var ri=S.roomInfo||{};
  roomsRemember({url:S.remote.url,room:S.remote.room,name:ri.name||'',code:ri.code||''});
  syncAddr();
  if(!ri.code&&!S.codeTried&&canWrite()){S.codeTried=true;setTimeout(function(){makeCode(false);},400);}
  if(view().me&&!S.modal){
    var f=null;try{f=sessionStorage.getItem('gbb_newroom');}catch(e){}
    if(f&&ri.code){try{sessionStorage.removeItem('gbb_newroom');}catch(e){}setTimeout(function(){if(!S.modal){openModal('invite',null);render();}},350);}
  }
}
function roomName(){return (S.roomInfo&&S.roomInfo.name)||'공부방';}
function inviteMsg(){
  var ri=S.roomInfo||{};
  return '공부방 플래너 \''+roomName()+'\'에 초대합니다.\n1. 링크 열기: '+joinLink(S.remote.url)+'\n2. 참여 코드 넣기: '+ri.code+'\n3. 내 이름 고르기';
}

function joinFail(msg){S.jst.busy=false;S.jst.err=msg;S.draft.joinCode='';S.sync=true;render();var e=document.getElementById('joinCode')||document.getElementById('rmCode');if(e)try{e.focus();}catch(x){}}
function joinGo(){
  var st=S.jst,url=S.join?S.join.url:(S.remote&&S.remote.url);
  if(!url||st.busy)return;
  var code=String(S.draft.joinCode||'').replace(/\D/g,'');
  if(Date.now()<st.until){st.err='여러 번 틀려서 잠시 막혔습니다. 30초 뒤에 다시 넣어 주세요.';render();return;}
  if(code.length!==JOIN_LEN){st.err='참여 코드는 숫자 6자리입니다.';render();return;}
  st.busy=true;st.err='';render();
  codeLookup(url,code).then(function(m){
    if(!m||!m.r||!/^[A-Za-z0-9_-]{12,40}$/.test(m.r)){
      st.fails=(st.fails||0)+1;if(st.fails>=5){st.fails=0;st.until=Date.now()+30000;}
      joinFail('맞는 방이 없습니다. 코드를 다시 확인해 주세요.');return;
    }
    if(S.remote&&S.remote.url===url&&S.remote.room===m.r){st.busy=false;S.draft.joinCode='';closeModal();flash('이미 이 방에 있습니다.');render();return;}
    lsSet('gbb_a2hs','1');
    goRoom({url:url,room:m.r,name:String(m.n||''),code:code});
  }).catch(function(){joinFail('확인하지 못했습니다. 인터넷 연결을 확인해 주세요.');});
}
document.addEventListener('input',function(e){
  var t=e.target;if(!t||!t.classList||!t.classList.contains('jcode'))return;
  var d=String(t.value||'').replace(/\D/g,'');
  if(d!==t.value&&d.length<=JOIN_LEN){t.value=d;}
  S.draft.joinCode=d;
  if(d.length===JOIN_LEN&&!S.jst.busy)joinGo();
});

function makeRoom(){
  if(!S.remote||!S.net||S.nrBusy)return;
  var nm=String(S.draft.nrName||'').trim().slice(0,16)||'새 공부방',seen={};
  var ppl=String(S.draft.nrPeople||'').split(/[\n,]+/).map(function(x){return x.trim().slice(0,12);}).filter(function(x){if(!x||seen[x])return false;seen[x]=1;return true;}).slice(0,12);
  var url=S.remote.url,room=newRoom(),cfg=clone(obj(S.config)),subs=S.nrSubj?clone(obj(S.subjects)):{};
  delete cfg.roster;delete cfg.admin;
  cfg.roster=ppl.map(function(n,i){return {id:'m'+(i+1),name:n};});
  if(typeof cfg.certHour!=='number')cfg.certHour=26;
  S.nrBusy=true;render();
  newCode(url).then(function(code){
    var now=Date.now(),jobs=[[room+'/d/meta/config',cfg],[room+'/d/meta/room',{name:nm,code:code,at:now}]];
    Object.keys(subs).forEach(function(k){if(/^[A-Za-z0-9_-]{1,80}$/.test(k)&&subs[k]&&typeof subs[k]==='object')jobs.push([room+'/d/subjects/'+k,subs[k]]);});
    jobs.push(['joincode-'+code,{r:room,n:nm,at:now}]);
    var i=0;
    function next(){if(i>=jobs.length)return Promise.resolve();var j=jobs[i++];return fbRaw(url,j[0],'PUT',j[1]).then(next);}
    return next().then(function(){
      if(ppl.length){try{localStorage.setItem('gbb_me@'+room,'m1');localStorage.setItem('gbb_pinask@'+room,JSON.stringify({m1:1}));}catch(e){}}
      try{sessionStorage.setItem('gbb_newroom','1');}catch(e){}
      S.draft.nrName='';S.draft.nrPeople='';persistDrafts();
      goRoom({url:url,room:room,name:nm,code:code});
    });

      for(k in x.manual){var b=+x.manual[k]||0;tm+=b;if(b)o.subj[k]=(o.subj[k]||0)+b;}
      o.daily.push(tm);o.mins+=tm;o.done+=dn;o.n+=g.length;o.ddone.push(dn);o.dn.push(g.length);

function rollSong(){
  var ids=(S._songIds||[]).slice();if(ids.length<2||(S.songRoll&&!S.songRoll.done))return;

    if(i>=steps){
      S.songRoll={id:fin,done:true};render();

    h+='<section class="card" id="c-bingo-'+mon+'" style="--k:0"><div class="ct"><h2>스터디 빙고<small>'+esc(shortDate(mon)+' ~ '+shortDate(addDays(mon,6)))+'</small></h2><span class="tag a">'+me.lines+'줄, '+me.pts+'점</span></div><div class="bingo">';

    V.roster.map(function(m){return {p:V.byId[m.id],b:B.per[m.id]};}).sort(function(a,b){return b.b.lines-a.b.lines||b.b.n-a.b.n;}).forEach(function(x){
      h+='<div class="brow">'+av(x.p,'s')+'<span>'+esc(x.p.name)+'</span><span class="mini" aria-hidden="true">'+x.b.done.map(function(d){return '<i class="'+(d?'on':'')+'"></i>';}).join('')+'</span><small>'+x.b.n+'칸, '+x.b.lines+'줄</small></div>';
    });
    h+='</div></section>';
  }else if(pt==='duel'){
    h+='<section class="card" id="c-duels" style="--k:0"><div class="ct"><h2>1:1 대결</h2><button class="btn small primary" data-act="open" data-modal="duel"'+(V.roster.length<2?' disabled':'')+'>대결 신청</button></div>';
    var dl=duelList(V).filter(function(d){return d.state!=='done'||diffDays(d.end,t)<=14;}).slice(0,8);
    if(!dl.length)h+='<p class="empty">아직 대결이 없습니다. 한 명을 골라 2일 동안의 점수로 겨뤄보세요.</p>';
    dl.forEach(function(d){h+=duelRow(V,d);});

    V.roster.forEach(function(m){h+='<div class="brow">'+av(V.byId[m.id],'s')+'<span>'+esc(V.byId[m.id].name)+'</span><span></span><small>'+(wins[m.id]||0)+'승</small></div>';});
    h+='</div></section>';
  }else{
    h+=badgeView(V);

}
function wheelSvg(labels){
  var n=labels.length,seg=360/n,fills=['var(--accent-soft)','var(--fill)','var(--surface)'],svg='';
  function pt(a,r){var rad=a*Math.PI/180;return (r*Math.sin(rad)).toFixed(2)+','+(-r*Math.cos(rad)).toFixed(2);}
  labels.forEach(function(g,i){
    var a0=i*seg,a1=(i+1)*seg,c=a0+seg/2,fill=fills[(i===n-1&&i%3===0)?1:i%3];
    svg+='<path d="M0,0 L'+pt(a0,100)+' A100,100 0 '+(seg>180?1:0)+',1 '+pt(a1,100)+' Z" fill="'+fill+'" stroke="var(--line)" stroke-width="1"/>';
    svg+='<text transform="rotate('+(c-90).toFixed(2)+') translate(58,0)" text-anchor="middle" dominant-baseline="central">'+esc(cut(g,n>5?8:11))+'</text>';
  });
  return svg+'<circle r="100" fill="none" stroke="var(--line)" stroke-width="2"/>';
}
function modalRoul(V){

  if(sp.text&&!w.spinning)b+='<div class="picked" id="rpicked" role="status"><small>뽑힌 벌칙</small><p>'+esc(sp.text)+'</p></div><div class="df"><button class="btn primary" data-act="modal-close">확인</button></div>';

  return dlg('',{id:'roul',t:'벌칙 룰렛'},b);
}
function modalDuel(V){

  b+='</div></div>';
  return dlg('wide',{id:'duel',t:'1:1 대결 신청'},b,'<span class="hint">신청하면 상대에게 알림이 갑니다.</span><div class="df"><button class="btn primary" data-act="duel-add"'+(f.b?'':' disabled')+'>신청하기</button></div>');

function spinRoul(){
  var w=S.roul;if(!w||w.spinning)return;
  var V=view();if(!V.me||!need()||obj(V.spins[w.key]).text)return;
  var n=w.items.length,seg=360/n,idx=Math.floor(Math.random()*n),jit=(Math.random()-.5)*seg*.6;
  w.rot=Math.ceil(w.rot/360)*360+360*5+(360-(idx+.5)*seg)+jit;w.spinning=true;
  render();
  setTimeout(function(){w.spinning=false;if(S.roul===w&&canWrite())save('spins/'+w.key,{mid:V.me,text:w.items[idx],at:Date.now()});render();},reduced?60:4500);
}
function afterPlay(V){
  var t=today();if(t<START||t>END)return;
  var mon=mondayOf(t),st=standings(V,mon,addDays(mon,6)),mine=0,pts={},ahead=[],prev=null,pb=null;
  st.forEach(function(x){pts[x.p.id]=x.total;if(x.p.id===V.me)mine=x.total;});
  st.forEach(function(x){if(x.p.id!==V.me&&x.total>mine)ahead.push(x.p.id);});
  try{prev=JSON.parse(lsGet('gbb_ahead')||'null');}catch(e){}
  if(prev&&prev.week===mon&&prev.me===V.me&&Array.isArray(prev.ids)&&Array.isArray(prev.seen)){
    ahead.forEach(function(id){if(prev.ids.indexOf(id)<0&&prev.seen.indexOf(id)>=0)addNote({id:'pass'+id+pts[id],key:'pass'+id,title:V.byId[id].name+' 님이 나를 추월했습니다',sub:'이번 주 '+shortName(V.byId[id].name)+' '+pts[id]+'점, 나 '+mine+'점',tab:'rank'});});
    prev.ids.forEach(function(id){if(ahead.indexOf(id)<0&&V.byId[id]&&pts[id]<mine)addNote({id:'over'+id+mine,key:'pass'+id,title:V.byId[id].name+' 님을 추월했습니다',sub:'이번 주 나 '+mine+'점, '+shortName(V.byId[id].name)+' '+pts[id]+'점',tab:'rank'});});
  }
  var now=JSON.stringify({week:mon,me:V.me,ids:ahead,seen:V.roster.map(function(m){return m.id;})});
  if(now!==lsGet('gbb_ahead'))lsSet('gbb_ahead',now);
  var earned=badgeList(V,V.me).filter(function(b){return b.on;});
  try{pb=JSON.parse(lsGet('gbb_badges')||'null');}catch(e){}
  if(pb&&pb.v===2&&pb.me===V.me&&Array.isArray(pb.ids))earned.forEach(function(b){if(pb.ids.indexOf(b.id)<0)addNote({id:'bd'+b.id,key:'bd'+b.id,title:'새 배지: '+b.name+' ('+b.tname+')',sub:'최종 점수에 '+b.pts+'점이 더해집니다. 칭호: '+b.title,tab:'play'});});
  var nb=JSON.stringify({v:2,me:V.me,ids:earned.map(function(b){return b.id;})});
  if(nb!==lsGet('gbb_badges'))lsSet('gbb_badges',nb);
}

function modalReward(V){
  var t=today(),x=obj(V.days[V.me+'_'+t]),claimed=!!x.in,sc=V.sc[V.me]||{},ys=sc[addDays(t,-1)];
  var streak=claimed?sc[t].streak:((ys&&ys.att?ys.streak:0)+1),pos=((streak-1)%7)+1,base=streak-pos,slots='';
  for(var i=1;i<=7;i++){
    var on=i<pos||(i===pos&&claimed);
    slots+='<div class="d7'+(on?' on':'')+(i===pos&&!claimed?' today':'')+(i===pos&&claimed?' now':'')+'"><i>+'+attReward(base+i)+'</i><span>'+(base+i)+'일째</span></div>';
  }
  var b='<p class="hint">하루 한 번 출석하면 점수를 받습니다. 연속으로 출석할수록 점수가 오르고, 7일째에는 10점을 더 받습니다.</p><div class="days7">'+slots+'</div>';

  if(claimed)b+='<div class="center"><div class="gain">+'+sc[t].att+'<small>점</small></div><p class="hint" style="margin:8px 0 18px">연속 출석 '+streak+'일째입니다.</p><button class="btn xl primary" data-act="modal-close">확인</button></div>';
  else b+='<button class="btn xl primary" data-act="checkin">출석하고 '+attReward(streak)+'점 받기</button>';
  return dlg('',{id:'reward',t:claimed?'출석 완료':'오늘 출석'},b);
}
function cmpText(){
  var c=S.cmp,parts=[],note=String(S.draft.cmpNote||'').trim();
  if(c.type)parts.push(c.type);
  if(c.amt>0)parts.push(c.amt+(c.unit||'문제'));
  var t=parts.join(' ');
  return note?(t?t+' ('+note+')':note):t;
}
function recentGoals(V,date){
  var cur=dayOf(V,V.me,date).goals,seen={},out=[];
  cur.forEach(function(g){seen[(g.sid||'')+'|'+g.text]=1;});
  Object.keys(V.days).filter(function(k){return k.indexOf(V.me+'_')===0;}).sort().reverse().forEach(function(k){
    arr(obj(V.days[k]).goals).forEach(function(g){var key=(g.sid||'')+'|'+g.text;if(!g.text||seen[key]||out.length>=6)return;seen[key]=1;out.push({text:g.text,sid:g.sid||''});});
  });
  return out;
}

function compress(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('read'));};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){rej(new Error('decode'));};
      img.onload=function(){
        var w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,1280/Math.max(w,h)),q=.72,c=document.createElement('canvas'),d,n=0;
        function draw(){c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);}
        d=draw();
        while(d.length>170000&&n<8){sc*=.82;q=Math.max(.45,q-.05);d=draw();n++;}
        if(d.length>230000||d.indexOf('data:image/jpeg')!==0)rej(new Error('big'));else res(d);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    case 'msg-del':{

      if(kc==='KeyL'){e.preventDefault();if(S.tab!=='cal'){goTab('cal');}else{var ci=0;CMODES.forEach(function(x,j){if(x[0]===S.calMode)ci=j;});setCalMode(CMODES[(ci+1)%CMODES.length][0]);}render();return;}
      if(kc==='KeyT'){e.preventDefault();if(liveOf(V0,V0.me))stopTimer();else{if(S.tab!=='room')goTab('room');startTimer();}render();return;}
      if(kc==='KeyF'&&liveOf(V0,V0.me)){e.preventDefault();act('focus-open',{getAttribute:function(){return null;}});return;}
    }
  }
  if(e.key!=='Enter'||e.isComposing||e.keyCode===229)return;
  var t=e.target,a=t.getAttribute&&t.getAttribute('data-enter');
  if(!a||t.tagName==='TEXTAREA')return;
  e.preventDefault();
  var k=t.getAttribute('data-draft');if(k)S.draft[k]=t.value;
  var r=t.getBoundingClientRect();S.pt={x:r.left+r.width/2,y:r.top};
  act(a,t);
});
document.addEventListener('focusout',function(){if(retry){retry=false;setTimeout(render,0);}});
document.addEventListener('load',function(e){
  var t=e.target,ml=document.getElementById('msgList');
  if(!ml||!t||t.tagName!=='IMG'||!ml.contains(t))return;
  if(ml.scrollHeight-ml.scrollTop-ml.clientHeight<t.offsetHeight+180)ml.scrollTop=ml.scrollHeight;
},true);
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  if(S.modal&&S.modal.type==='focus')lock(true);
  tick();
});
setInterval(tick,1000);

/* ---------- 저장소 연결 ---------- */
function setAt(tree,path,val){
  var segs=String(path).split('/').filter(Boolean);
  if(!segs.length)return obj(val);
  var o=tree;
  for(var i=0;i<segs.length-1;i++){if(!o[segs[i]]||typeof o[segs[i]]!=='object')o[segs[i]]={};o=o[segs[i]];}
  if(val===null||val===undefined)delete o[segs[segs.length-1]];else o[segs[segs.length-1]]=val;
  return tree;
}
var COLLS=['subjects','days','progress','quiz','events','live','replies','msgs','songs','duels','spins','locks','flags','plans'];
function fromTree(tree){
  var c=obj(tree.meta).config;
  S.config=c&&typeof c==='object'?c:null;
  S.roomInfo=obj(obj(tree.meta).room);
  COLLS.forEach(function(k){S[k]=obj(tree[k]);});
  S.ready=true;render();
  try{roomTick();}catch(e){}
}
function claudeNet(db){
  function toMap(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});return m;}
  function mark(k){S.loaded[k]=true;if(S.loaded.config&&COLLS.every(function(c){return S.loaded[c];}))S.ready=true;render();}
  function err(e){var c=e&&e.code;if(c==='revoked'||c==='not_granted')S.readOnly=true;else flash('실시간 연결이 끊겼습니다. 화면을 새로 열어주세요.');S.ready=true;render();}
  return {mode:'claude',
    write:function(path,d){var ref=db.doc(path);return d===null?ref.delete():ref.set(d);},
    read:function(path){return db.doc(path).get().then(function(s){return s.exists?s.data():null;});},
    start:function(){
      db.doc('meta/config').onSnapshot(function(s){S.config=s.exists?s.data():null;mark('config');},err);
      COLLS.forEach(function(c){var q=db.collection(c);q=c==='msgs'?q.orderBy('at','desc').limit(600):q.limit(1000);q.onSnapshot(function(s){S[c]=toMap(s);mark(c);},err);});
    }};
}
function firebaseNet(base,room){
  var rm=base.replace(/\/+$/,'')+'/rooms/'+encodeURIComponent(room),tree={};
  function url(path){return path.indexOf('pics/')===0?rm+'/p/'+path.slice(5)+'.json':rm+'/d/'+path+'.json';}
  function chk(r){if(!r.ok){var e=new Error('http '+r.status);e.code=(r.status===401||r.status===403)?'not_granted':'unavailable';throw e;}return r;}
  return {mode:'firebase',
    write:function(path,d){return fetch(url(path),{method:d===null?'DELETE':'PUT',headers:{'Content-Type':'application/json'},body:d===null?undefined:JSON.stringify(d)}).then(chk).then(function(){});},
    read:function(path){return fetch(url(path)).then(chk).then(function(r){return r.json();});},
    start:function(){
      var es=null;
      document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&es&&es.readyState===2)open();});
      open();
      function open(){
      es=new EventSource(rm+'/d.json');
      es.addEventListener('put',function(ev){var m=JSON.parse(ev.data);tree=setAt(tree,m.path,m.data);fromTree(tree);});
      es.addEventListener('patch',function(ev){var m=JSON.parse(ev.data);Object.keys(obj(m.data)).forEach(function(k){tree=setAt(tree,m.path+'/'+k,m.data[k]);});fromTree(tree);});
      es.addEventListener('cancel',function(){S.readOnly=true;S.ready=true;render();});
      es.addEventListener('auth_revoked',function(){S.readOnly=true;S.ready=true;render();});
      es.onerror=function(){if(!S.ready){S.ready=true;flash('공유 저장소에 연결하지 못했습니다. 인터넷 연결을 확인하세요.');render();}};
      }
    }};
}
function localNet(){
  var tree={},pics={};try{tree=obj(JSON.parse(lsGet('gbb_local')||'{}'));}catch(e){}
  return {mode:'local',
    write:function(path,d){
      if(path.indexOf('pics/')===0){if(d===null)delete pics[path];else pics[path]=d;return Promise.resolve();}
      tree=setAt(tree,path,d===null?null:clone(d));lsSet('gbb_local',JSON.stringify(tree));fromTree(tree);return Promise.resolve();
    },
    read:function(path){return Promise.resolve(pics[path]||null);},
    start:function(){fromTree(tree);}};
}
function remoteConfig(){
  var h=null,sv=null,r=null;
  try{h=new URLSearchParams(String(location.hash||'').slice(1));}catch(e){}
  try{sv=JSON.parse(lsGet('gbb_remote')||'null');}catch(e){}
  if(h&&h.get('db')){r={url:String(h.get('db')).replace(/\/+$/,''),room:h.get('room')||''};if(validRemote(r))lsSet('gbb_remote',JSON.stringify(r));}
  else if(h&&(h.get('join')||h.get('j'))){
    var ju=dbFromToken(h.get('join')||h.get('j'));if(!ju)return null;
    if(!h.get('join')&&sv&&String(sv.url).replace(/\/+$/,'')===ju&&validRemote(sv))r=sv;
    else return {join:true,url:ju};
  }
  else r=sv;
  if(r&&r.url)r.url=String(r.url).replace(/\/+$/,'');
  return validRemote(r)?r:null;
}
function validRemote(r){return !!r&&/^https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/i.test(r.url||'')&&/^[A-Za-z0-9_-]{12,40}$/.test(r.room||'');}
function newRoom(){var a='abcdefghijkmnpqrstuvwxyz23456789',o='',b=new Uint8Array(16),i;try{crypto.getRandomValues(b);}catch(e){for(i=0;i<16;i++)b[i]=Math.floor(Math.random()*256);}for(i=0;i<16;i++)o+=a[b[i]%a.length];return o;}
function parseRemote(v){
  v=String(v||'').trim();var i=v.indexOf('#'),r=null,m;
  if(i>=0){try{var h=new URLSearchParams(v.slice(i+1));if(h.get('db'))r={url:h.get('db'),room:h.get('room')||''};}catch(e){}}
  if(!r&&(m=v.match(/https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)/i)))r={url:m[0],room:''};
  if(!r)return null;
  r.url=String(r.url).replace(/\/+$/,'');if(!r.room)r.room=newRoom();
  return validRemote(r)?r:null;
}
function inviteLink(r){return String(location.href).split('#')[0]+'#db='+encodeURIComponent(r.url)+'&room='+encodeURIComponent(r.room);}
var FB_RULES='{\n  "rules": {\n    ".read": false,\n    ".write": false,\n    "rooms": {\n      "$room": {\n        ".read": "$room.length >= 12",\n        ".write": "$room.length >= 12"\n      }\n    }\n  }\n}';
function connect(rc){
  lsSet('gbb_remote',JSON.stringify(rc));roomsRemember({url:rc.url,room:rc.room});
  try{history.replaceState(null,'',inviteLink(rc));}catch(e){}
  location.reload();
}
function viewSetup(){
  var h='<div class="view" id="view-setup"><div class="gatebox"><div><h1>공부방 플래너 연결</h1><p class="hint" style="margin-top:6px">초대 메시지를 받았다면 메시지의 링크를 눌러 열고 참여 코드를 넣으세요. 링크를 아래에 붙여넣어도 됩니다. 처음 만드는 사람만 Firebase 데이터베이스 주소를 붙여넣습니다.</p></div>';
  h+='<section class="card" id="c-setup"><label for="setupIn" class="lb">초대 링크 또는 데이터베이스 주소</label><div class="row"><input type="text" id="setupIn" data-draft="setupIn" data-enter="setup-go" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="초대 링크 또는 https://...firebasedatabase.app" aria-label="초대 링크 또는 데이터베이스 주소"><button class="btn primary" data-act="setup-go">연결</button></div>'+(S.setupErr?'<p class="hint serr" role="status">'+esc(S.setupErr)+'</p>':'')+'</section>';
  h+='<section class="card" id="c-rules"><h2 class="sh">Firebase 보안 규칙</h2><p class="hint">데이터베이스를 처음 만들 때 Realtime Database의 규칙 탭에 아래 내용을 그대로 붙여넣고 게시하세요. 초대 링크를 아는 사람만 기록을 보고 쓸 수 있게 합니다.</p><pre class="rules" id="fbRules">'+esc(FB_RULES)+'</pre><div class="row"><button class="btn small" data-act="copy-rules">규칙 복사</button></div></section>';
  return h+'</div></div>';
}
function copyText(t,okMsg,el){
  var fail=function(){if(el){try{var r=document.createRange();r.selectNodeContents(el);var sl=window.getSelection();sl.removeAllRanges();sl.addRange(r);}catch(e){}}flash('복사가 막혀 있습니다. 선택된 글자를 길게 눌러 복사하세요.');};
  try{navigator.clipboard.writeText(t).then(function(){flash(okMsg);},fail);}catch(e){fail();}
}
function importData(txt){
  var j=null;try{j=JSON.parse(txt);}catch(e){}
  if(!j||j.app!=='gbb-planner'||!j.d||typeof j.d!=='object'){S.importMsg='공부방 플래너 기록 파일이 아닙니다.';render();return;}
  var ok=COLLS.concat(['meta']),jobs=[];
  Object.keys(j.d).forEach(function(c){if(ok.indexOf(c)<0)return;var col=obj(j.d[c]);Object.keys(col).forEach(function(id){if(/^[A-Za-z0-9_-]{1,80}$/.test(id)&&col[id]&&typeof col[id]==='object')jobs.push([c+'/'+id,col[id]]);});});
  Object.keys(obj(j.p)).forEach(function(id){var p=obj(j.p[id]);if(/^[A-Za-z0-9_-]{1,80}$/.test(id)&&typeof p.data==='string'&&p.data.indexOf('data:image/')===0)jobs.push(['pics/'+id,{data:p.data}]);});
  if(!jobs.length){S.importMsg='가져올 기록이 없습니다.';render();return;}
  var n=0;S.importMsg='가져오는 중입니다. 0/'+jobs.length;render();
  (function next(){
    if(n>=jobs.length){S.importMsg='기록 '+jobs.length+'개를 가져왔습니다.';render();return;}
    var x=jobs[n];
    S.net.write(x[0],x[1]).then(function(){n++;S.importMsg='가져오는 중입니다. '+n+'/'+jobs.length;render();next();})
      .catch(function(){S.importMsg='가져오다가 멈췄습니다. 인터넷 연결과 Firebase 규칙을 확인한 뒤 다시 가져오세요.';render();});
  })();
}
async function init(){
  render();
  var db=null,user=null;
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      var r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);db=r[0];user=r[1];
    }
  }catch(e){}
  if(db){
    S.net=claudeNet(db);
    if(user&&typeof user.can==='function'){try{if((await user.can('data.write'))===false)S.readOnly=true;}catch(e){}}
  }else{
    var rc=remoteConfig();
    if(rc&&rc.join&&window.fetch){S.join={url:rc.url};S.ready=true;render();return;}
    if(!rc||!window.EventSource||!window.fetch){S.setup=true;S.ready=true;render();return;}
    S.remote=rc;S.net=firebaseNet(rc.url,rc.room);
    try{syncAddr();}catch(e){}
  }
  try{S.net.start();}catch(e){S.setup=true;S.ready=true;S.setupErr='연결하지 못했습니다. 주소를 다시 확인하세요.';render();}
}
init();
})();
