<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공부방 플래너</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공부방">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --fill:#F1F3F5; --line:#E6E8EC;
  --ink:#1A1C20; --ink-2:#565C67; --ink-3:#8E95A1;
  --accent:#2B6DEF; --on-accent:#FFFFFF; --accent-soft:#E9F0FE; --accent-ink:#2360DC; --accent-mark:#2B6DEF;
  --font-body:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif; --font-display:inherit;
  color-scheme:light;
  --red:#D6363D; --red-soft:#FDECEC; --on-red:#FFFFFF;
  --scrim:rgba(18,20,24,.44); --shadow:0 30px 70px -26px rgba(18,20,24,.4);
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.5,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@supports (animation-timing-function: linear(0, 1)){
  :root{--spring:linear(0, .22 5%, .67 14%, .93 21%, 1.05 29%, 1.07 35%, 1.05 43%, 1.015 55%, .997 68%, 1)}
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --surface:#191B20; --fill:#22252B; --line:#2D3138;
    --ink:#F2F3F5; --ink-2:#B3B8C2; --ink-3:#7C828D;
    --accent:#6A9CFF; --on-accent:#081226; --accent-soft:#1C2A44; --accent-ink:#6A9CFF; --accent-mark:#6A9CFF;
    color-scheme:dark;
    --red:#FF7376; --red-soft:#3A1E20; --on-red:#33090B;
    --scrim:rgba(0,0,0,.6); --shadow:0 30px 70px -26px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#191B20; --fill:#22252B; --line:#2D3138;
  --ink:#F2F3F5; --ink-2:#B3B8C2; --ink-3:#7C828D;
  --accent:#6A9CFF; --on-accent:#081226; --accent-soft:#1C2A44; --accent-ink:#6A9CFF; --accent-mark:#6A9CFF;
  color-scheme:dark;
  --red:#FF7376; --red-soft:#3A1E20; --on-red:#33090B;
  --scrim:rgba(0,0,0,.6); --shadow:0 30px 70px -26px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:var(--font-body);
  font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
small{font-size:inherit}

/* 뼈대 */
#app{height:100%;display:flex}
.rail{flex:none;width:84px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0}
.navs{position:relative;display:flex;flex-direction:column;width:100%}
.navs button{position:relative;height:62px;background:none;border:0;padding:0;display:grid;place-items:center;align-content:center;gap:6px;color:var(--ink-3);font-size:11px;font-weight:600;transition:color .3s}
.navs button[aria-current="page"]{color:var(--accent-ink)}
.navs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ind{position:absolute;left:14px;top:4px;width:56px;height:54px;background:var(--accent-soft);border-radius:16px;transform:translateY(calc(var(--i,0)*62px));transition:transform .55s var(--spring)}
.mebtn{margin-top:auto;background:none;border:0;padding:4px;display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink-3)}
#app.gate .rail{display:none}
.stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#banner:empty{display:none}
.notice{background:var(--fill);color:var(--ink-2);padding:9px 20px;font-size:13px;border-bottom:1px solid var(--line)}
.flash{background:var(--ink);color:var(--surface);padding:9px 20px;font-size:13px;animation:rowIn .4s var(--ease)}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:26px clamp(14px,3vw,34px) 56px}
.view{max-width:1160px;margin:0 auto;animation:viewIn .45s var(--ease) both}
.view.leaving{animation:viewOut .14s ease-in both}
.loading{color:var(--ink-2);padding:40px 8px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:18px;flex-wrap:wrap}
.vhead h1{font-size:clamp(22px,2.8vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1.25}
.vhead p{color:var(--ink-2);margin-top:2px;font-size:14px;max-width:62ch}
.vacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 부품 */
.card{background:var(--surface);border-radius:20px;padding:20px;min-width:0;animation:cardIn .55s var(--ease) both;animation-delay:calc(var(--k,0)*50ms)}
.ct{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;min-height:36px;flex-wrap:wrap}
.ct h2{font-size:16px;font-weight:700}
.ct h2 small{font-weight:500;color:var(--ink-3);font-size:14px;margin-left:6px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--fill);color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap;
  transition:transform .3s var(--spring),background .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.small{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.xl{height:54px;font-size:17px;border-radius:15px;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:5px 14px;border-radius:999px;border:0;background:var(--fill);font-weight:500;font-size:14px;text-align:left;
  transition:transform .3s var(--spring),background .2s,color .2s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none;white-space:nowrap}
.tag{display:inline-block;font-style:normal;background:var(--fill);color:var(--ink-2);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;line-height:1.7;white-space:nowrap}
.tag.a{background:var(--accent-soft);color:var(--accent-ink)}
.tag.r{background:var(--red-soft);color:var(--red)}
.pill{display:inline-flex;align-items:center;height:36px;padding:0 13px;border-radius:999px;background:var(--surface);font-weight:600;font-size:13px;color:var(--ink-2)}
.pill b{color:var(--ink);font-weight:800;margin-left:6px}
.hint{font-size:13px;color:var(--ink-2)}
.empty{color:var(--ink-3);font-size:14px;padding:4px 0}
input[type=text],select,textarea{border:0;border-radius:12px;padding:11px 14px;font-size:16px;background:var(--fill);color:var(--ink);min-height:46px;width:100%;min-width:0;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}
input[type=text]:focus,select:focus,textarea:focus{outline:0;box-shadow:inset 0 0 0 1.5px var(--accent-ink)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > input{flex:1 1 160px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;background:var(--fill);color:var(--ink-2)}
.av.me{background:var(--accent-soft);color:var(--accent-ink)}
.av.s{width:30px;height:30px;font-size:11px}
.del{background:none;border:0;color:var(--ink-3);font-size:13px;height:38px;padding:0 8px;border-radius:10px;white-space:nowrap}
.del:active{background:var(--fill)}
.chk{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0;flex:none}
.chk > span,.mk{position:relative;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-3);transition:box-shadow .25s,background .25s,transform .3s var(--spring)}
.chk > span::after,.mk::after{content:"";position:absolute;left:8px;top:4.5px;width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.4px 2.4px 0;transform:rotate(45deg) scale(0);transition:transform .35s var(--spring)}
.chk.on > span,.mk.on{background:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.chk.on > span::after,.mk.on::after{transform:rotate(45deg) scale(1)}
.chk:active > span{transform:scale(.86)}
.chk:disabled{cursor:default;opacity:.5}
.mk{display:inline-block;width:18px;height:18px;flex:none;box-shadow:inset 0 0 0 1.6px var(--line)}
.mk::after{left:6px;top:3px;width:4.5px;height:8.5px;border-width:0 2px 2px 0}
.mk.off{opacity:.35;box-shadow:inset 0 0 0 1.6px var(--line);border-radius:50%;background:repeating-linear-gradient(45deg,var(--line) 0 2px,transparent 2px 4px)}

/* 처음 화면 */
.gatebox{max-width:460px;margin:8vh auto 0;display:grid;gap:18px}
.gatebox h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.people{display:grid;gap:8px}
.person{display:flex;align-items:center;gap:12px;background:var(--surface);border:0;border-radius:16px;padding:12px 16px;font-size:16px;font-weight:600;text-align:left;transition:transform .3s var(--spring)}
.person:active{transform:scale(.98)}

/* 달력 */
.calwrap{display:grid;gap:16px;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"cal day" "up day";align-items:start}
.calwrap > .calcard{grid-area:cal}.calwrap > .daycol{grid-area:day}.calwrap > .upcard{grid-area:up}
.col{display:grid;gap:16px;align-content:start;min-width:0}
.mnav{display:flex;align-items:center;gap:6px}
.mnav h1{min-width:6.2em}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--ink-2);transition:transform .3s var(--spring)}
.ib:active{transform:scale(.9)}
.ib:disabled{opacity:.35}
.calcard{padding:14px 12px 12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow{font-size:12px;font-weight:600;text-align:center;padding:4px 0 8px;color:var(--ink-3)}
.dow.sun{color:var(--red)}
.cell{background:none;border:0;border-radius:14px;min-height:92px;padding:6px 6px 7px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;min-width:0;transition:background .25s}
.cell .dn{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:14px;font-weight:600;flex:none}
.cell.sun .dn{color:var(--red)}
.cell.other{opacity:.32}
.cell.today .dn{background:var(--accent);color:var(--on-accent);font-weight:700}
.cell.sel{background:var(--accent-soft)}
.ev{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;max-width:100%;font-size:11px;font-weight:600;line-height:1.35;padding:2px 6px;border-radius:6px;overflow:hidden;background:var(--fill);color:var(--ink-2)}
.ev.exam{background:var(--red-soft);color:var(--red)}
.ev.mine{background:var(--accent-soft);color:var(--accent-ink)}
.cell.sel .ev.mine{background:var(--surface)}
.cell .todo{margin-top:auto;font-size:11px;font-weight:600;color:var(--ink-3);padding-left:4px;font-variant-numeric:tabular-nums}
.cell .todo.all{color:var(--accent-ink)}
.uprow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.ct + .uprow{border-top:0}
.uprow b{font-weight:800;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.uprow small{color:var(--ink-3);font-size:13px;white-space:nowrap}
.daysum{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.daysum b{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.evrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;animation:rowIn .45s var(--ease) both}
.evrow > span{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.goal{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:2px;padding:1px 4px 1px 0;margin-left:-10px;border-radius:12px;transition:background .3s;animation:rowIn .45s var(--ease) both}
.goal.focus{background:var(--accent-soft)}
.gt{padding:6px 0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.gt > span{transition:color .3s}
.goal.done .gt > span{color:var(--ink-3);text-decoration:line-through}
.cert{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.cert .what{flex:1;min-width:150px}
.cert .what b{display:block;font-weight:600}

/* 공부방 */
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.stack{display:grid;gap:16px;min-width:0}
.clock{font-size:clamp(44px,7vw,64px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin:18px 0 4px;text-align:center}
.clock.idle{color:var(--ink-3)}
.clocksub{text-align:center;color:var(--ink-2);font-size:14px;margin-bottom:16px;min-height:21px}
.tbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.sec h3{font-size:14px;font-weight:700;margin-bottom:10px}
.sec h3 small{font-weight:500;color:var(--ink-3);margin-left:6px}
.sec label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
.times li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.times b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.times small{color:var(--ink-3);font-size:12px;margin-left:6px}
.ct + .fr{border-top:0}
.fl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fl b{font-weight:600}
.fr small{display:block;font-size:13px;color:var(--ink-2)}
.fr small.live{color:var(--accent-ink);font-weight:600;font-variant-numeric:tabular-nums}
.fp{text-align:right;white-space:nowrap}
.fp b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fp small{display:inline;font-size:12px;margin-left:1px}
.fgoals{padding:0 0 10px 52px;display:grid;gap:5px;animation:rowIn .4s var(--ease) both}
.fgoals li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
.fgoals li.done .t{color:var(--ink-3);text-decoration:line-through}
.fgoals .mk{margin-top:2px}

/* 진도 */
.tbl{--n:5;--cw:64px;padding:0;overflow:hidden}
.orow{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--n),var(--cw));align-items:stretch;border-top:1px solid var(--line)}
.olabel{padding:8px 20px;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.ocell{display:grid;place-items:center;min-height:46px;font-size:13px;min-width:0}
.ocell.me{background:var(--accent-soft)}
.ohead{border-top:0;font-weight:600;font-size:12px;color:var(--ink-2)}
.ohead .olabel{font-size:13px;color:var(--ink-3);padding-top:16px;padding-bottom:12px}
.ohead .ocell.me{color:var(--accent-ink)}
button.osum{width:100%;background:none;border:0;border-top:1px solid var(--line);padding:0;text-align:left}
.osum .olabel{padding:14px 20px}
.osum .olabel b{font-weight:600;font-size:15px}
.osum .chev{font-size:12px;color:var(--ink-3)}
.osum .frac{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.osum .skip{font-size:11px;color:var(--ink-3)}
.oitem{animation:rowIn .4s var(--ease) both}
.oitem .olabel{padding-left:36px;color:var(--ink-2)}
.ofoot{border-top:1px solid var(--line);padding:12px 20px;display:grid;gap:8px}

/* 순위 */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:12px;padding:4px;gap:2px}
.seg button{background:none;border:0;border-radius:9px;padding:0 16px;height:34px;font-size:14px;font-weight:500;color:var(--ink-2);transition:background .25s,color .25s;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.rk{display:grid;grid-template-columns:26px 40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ct + .rk{border-top:0}
.rk .n{font-size:17px;font-weight:800;text-align:center;color:var(--ink-3)}
.rk .line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rk .line b{font-weight:600}
.rk .bar{height:6px;background:var(--fill);border-radius:3px;margin:6px 0 4px;overflow:hidden}
.rk .bar i{display:block;height:100%;border-radius:3px;background:var(--ink-3);transition:width .7s var(--ease)}
.rk.me .bar i{background:var(--accent-mark)}
.rk .sub{font-size:12px;color:var(--ink-3)}
.rk .t{text-align:right;white-space:nowrap}
.rk .t b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rk .t small{font-size:12px;color:var(--ink-2);margin-left:1px}
.wtwrap{overflow-x:auto;margin:0 -4px}
.wt{border-collapse:separate;border-spacing:3px;width:100%;font-variant-numeric:tabular-nums}
.wt th{font-size:12px;font-weight:600;color:var(--ink-3);padding:4px 2px;text-align:center;white-space:nowrap}
.wt th.nm{text-align:left;color:var(--ink);font-size:13px}
.wt td{text-align:center;font-size:13px;font-weight:600;padding:8px 2px;border-radius:8px;background:var(--fill);min-width:38px}
.wt td.z{color:var(--ink-3);font-weight:400}
.wt td.w{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.wt td.sum{background:none;font-weight:800}
.rules li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.rules li:first-child{border-top:0}
.rules li b{font-weight:600}
.rules li span{color:var(--ink-2)}
.pen{display:grid;gap:8px}
.pen div{background:var(--fill);border-radius:12px;padding:12px 14px}
.pen small{display:block;font-size:12px;color:var(--ink-3);margin-bottom:2px}
.pen b{font-weight:600}

/* 게시판 */
.q .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.q .meta b{font-weight:600}
.q .meta time{margin-left:auto;color:var(--ink-3);font-size:12px}
.q .body{white-space:pre-wrap}
.shot{display:block;margin-top:12px;border:0;padding:0;background:var(--fill);border-radius:14px;overflow:hidden;max-width:min(100%,420px)}
.shot img{display:block;max-width:100%;max-height:320px}
.shot.ph{padding:14px 16px;color:var(--ink-2);font-size:13px;font-weight:600}
.q .ans{margin-top:12px;padding:12px 14px;background:var(--fill);border-radius:12px;white-space:pre-wrap;font-size:14px;animation:rowIn .4s var(--ease) both}
.q .qacts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px}
.q .solved{font-size:12px;color:var(--ink-3);margin-top:8px}
.rep{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:10px}
.rp{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;animation:rowIn .4s var(--ease) both}
.rp .rb{background:var(--fill);border-radius:12px;padding:8px 12px;font-size:14px;white-space:pre-wrap}
.rp .rb b{font-weight:600;font-size:13px;margin-right:6px}
.rp .rb time{color:var(--ink-3);font-size:12px}
.rp .shot{margin-top:6px}
.rin{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.thumb{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:12px;padding:8px}
.thumb img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.wkq li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.wkq small{color:var(--ink-3);font-size:13px}

/* 팝업 */
.layer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.layer:empty{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fadeIn .3s ease both}
.dialog{position:relative;width:min(500px,100%);max-height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border-radius:26px;box-shadow:var(--shadow);animation:dlgIn .5s var(--spring) both;outline:0}
.dialog.wide{width:min(620px,100%)}
.dialog.pic{width:auto;max-width:100%;background:none;box-shadow:none}
.dialog.pic img{display:block;max-width:100%;max-height:calc(100vh - 120px);border-radius:16px;margin:0 auto}
.layer.closing .scrim{animation:fadeOut .2s ease both}
.layer.closing .dialog{animation:dlgOut .2s ease both}
.dh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 24px 10px}
.dh h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.x{background:var(--fill);border:0;border-radius:999px;height:34px;padding:0 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.db{overflow-y:auto;overscroll-behavior:contain;padding:4px 24px 24px;min-height:0}
.dfoot{flex:none;border-top:1px solid var(--line);padding:14px 24px 20px;display:grid;gap:12px}
.fld{margin-top:18px}
.fld:first-child{margin-top:6px}
.fld h3{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.fld h3 small{font-weight:400;color:var(--ink-3);margin-left:4px}
.fld .chips + .chips{margin-top:8px}
.amt{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.amt b{font-size:26px;font-weight:800;min-width:60px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 4px}
.amt button{width:46px;height:42px;border-radius:12px;border:0;background:var(--fill);font-weight:600;font-size:14px;transition:transform .3s var(--spring)}
.amt button:active{transform:scale(.9)}
.preview{background:var(--fill);border-radius:14px;padding:10px 14px}
.preview small{display:block;font-size:12px;color:var(--ink-3);margin-bottom:1px}
.preview p{font-size:16px;font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:26px}
.preview .ph{color:var(--ink-3);font-weight:400;font-size:14px}
.df{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.quick{display:grid;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.center{text-align:center}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:20px 0}
.d7{display:grid;justify-items:center;gap:6px;font-size:11px;color:var(--ink-3);font-weight:600}
.d7 i{width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--ink-3);transition:background .3s}
.d7.today i{box-shadow:inset 0 0 0 2px var(--accent-ink);color:var(--accent-ink);background:none}
.d7.on i{background:var(--accent);color:var(--on-accent)}
.d7.now i{animation:popIn .5s var(--spring) both}
.gain{font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1.1;animation:popIn .6s .1s var(--spring) both}
.gain small{font-size:18px;color:var(--ink-2);margin-left:3px}
.wheelbox{position:relative;width:min(320px,74vw);aspect-ratio:1;margin:8px auto 18px}
.wheel{position:absolute;inset:0;transition:transform 4.4s cubic-bezier(.12,.72,.08,1)}
.wheel svg{width:100%;height:100%;display:block}
.wheel text{font-size:8.5px;font-weight:600;fill:var(--ink)}
.pin{position:absolute;left:50%;top:-8px;width:0;height:0;margin-left:-10px;border-left:10px solid transparent;border-right:10px solid transparent;border-top:18px solid var(--accent-ink);z-index:2}
.hub{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 3px var(--accent-ink);z-index:2}
.picked{background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin-bottom:14px;animation:dlgIn .5s var(--spring) both}
.picked small{display:block;font-size:12px;font-weight:600;color:var(--accent-ink)}
.picked p{font-size:18px;font-weight:700;margin-top:2px}
.brk li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.brk li:first-child{border-top:0}
.brk li small{display:block;font-size:12px;color:var(--ink-3)}
.brk li b{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.brk li.zero b{color:var(--ink-3);font-weight:400}
.mrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:8px}
.code{font-size:56px;font-weight:800;letter-spacing:-.02em;text-align:center;margin:10px 0 16px;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts .btn{height:64px;font-size:22px;font-weight:700}
.cd{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:18px}
.cd i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width 1s linear}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.pop{position:absolute;font-weight:700;font-size:17px;background:var(--accent);color:var(--on-accent);padding:4px 12px;border-radius:999px;white-space:nowrap;animation:popUp 1.2s var(--ease) both}
.pop.neg{background:var(--ink);color:var(--surface)}
#filePick{position:fixed;left:-9999px;width:1px;height:1px;opacity:0}

.pdots{display:flex;justify-content:center;gap:14px;margin:18px 0 6px}
.pdots i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-3);transition:background .2s,box-shadow .2s,transform .3s var(--spring)}
.pdots i.on{background:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);transform:scale(1.12)}
.pdots.bad i{box-shadow:inset 0 0 0 2px var(--red)}
.perr{min-height:20px;color:var(--red)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:8px auto 0}
.keys .btn{height:56px;font-size:20px;font-weight:700}
.keys .btn[data-v="x"]{font-size:14px;font-weight:600;background:none}
.sws{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.sw{width:40px;height:40px;border-radius:50%;border:0;padding:0;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);box-shadow:0 0 0 1px var(--line);transition:transform .3s var(--spring),box-shadow .2s}
.sw:active{transform:scale(.9)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.flag{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hint + .flag{border-top:0}
.flag b{font-weight:600;margin-right:6px}
.flag small{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.undo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border-radius:12px;padding:8px 8px 8px 14px;margin-top:10px;font-size:14px;animation:rowIn .4s var(--ease) both}
.undo .btn{background:var(--surface)}
.mlist{margin-top:10px}
.mlist li{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.mlist b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 도전 */
.bingo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.bcell{background:var(--fill);border-radius:14px;padding:10px 11px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;font-size:13px;font-weight:600;line-height:1.35;transition:background .4s,color .4s}
.bcell small{font-size:12px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bcell.on{background:var(--accent);color:var(--on-accent)}
.bcell.on small{color:var(--on-accent);opacity:.85}
.brow{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.brow small{color:var(--ink-2);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:repeat(3,9px);gap:2px}
.mini i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.mini i.on{background:var(--accent-mark)}
.bdgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.bdg{background:var(--fill);border:0;border-radius:14px;padding:10px 12px;text-align:left;display:grid;gap:2px;align-content:start;min-height:78px;color:var(--ink-3);font-size:12px}
.bdg b{font-weight:700;font-size:14px;color:var(--ink-2)}
.bdg small{font-size:12px;font-variant-numeric:tabular-nums}
.bdg.on{background:var(--accent-soft);color:var(--accent-ink);transition:transform .3s var(--spring),box-shadow .2s}
.bdg.on b{color:var(--accent-ink)}
.bdg.on:active{transform:scale(.96)}
.bdg[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent-ink)}
.duel{padding:14px 0;border-top:1px solid var(--line)}
.ct + .duel{border-top:0;padding-top:4px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:baseline}
.vs b{font-weight:600}
.vs .r{text-align:right}
.vs em{font-style:normal;font-size:12px;color:var(--ink-3);white-space:nowrap}
.vs .p{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.vbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--fill);margin:8px 0;gap:2px}
.vbar i{display:block;height:100%;flex-basis:0;background:var(--ink-3);opacity:.5;transition:flex-grow .7s var(--ease)}
.vbar i.me{background:var(--accent-mark);opacity:1}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:3px 0}
.pen p{font-size:14px}
/* 리포트 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border-radius:18px;padding:16px 18px;min-width:0;animation:cardIn .55s var(--ease) both;animation-delay:calc(var(--k,0)*50ms)}
.tile small{display:block;font-size:13px;color:var(--ink-2)}
.tile b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;margin:2px 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile span{font-size:12px;color:var(--ink-3)}
.tile span.up{color:var(--accent-ink);font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:17px;fill:var(--ink-3);font-family:inherit}
.chart .v{fill:var(--ink);font-weight:700}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .me{fill:var(--accent-mark)}
.chart .avg{fill:var(--ink-3);opacity:.4}
.lgd{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(72px,32%) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hb .tr{height:10px;background:var(--fill);border-radius:5px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:5px;background:var(--accent-mark);transition:width .7s var(--ease)}
.hb.o .tr i{background:var(--ink-3);opacity:.55}
.hb small{color:var(--ink-2);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tb th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tb tr:last-child td{border-bottom:0}
.tb tr.me td{background:var(--accent-soft)}
.tb tr.sum td{font-weight:700}
/* 메시지 */
.navs .badge{position:absolute;top:12px;left:50%;margin-left:7px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--surface)}
.navs .badge[hidden]{display:none}
.chat{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.chlist{padding:8px;display:grid;gap:2px}
.chrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-radius:12px;padding:9px 8px;text-align:left;transition:background .2s}
.chrow[aria-current="true"]{background:var(--accent-soft)}
.chrow b{font-weight:600;display:block}
.chrow small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.msgs{height:clamp(240px,52vh,540px);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px 12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.mrowx{display:flex;flex-direction:column;align-items:flex-start;max-width:78%;animation:rowIn .35s var(--ease) both}
.mrowx.mine{align-self:flex-end;align-items:flex-end}
.bb{background:var(--fill);border-radius:16px;padding:8px 13px;white-space:pre-wrap;font-size:15px}
.mine .bb{background:var(--accent);color:var(--on-accent)}
.mrowx small{font-size:11px;color:var(--ink-3);margin:2px 6px 0}
.sys{align-self:center;font-size:12px;color:var(--ink-2);background:var(--fill);border-radius:999px;padding:3px 12px;margin:6px 0}
.cin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-top:1px solid var(--line);padding-top:12px}
#notes{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:55;display:grid;gap:8px;width:min(360px,calc(100% - 28px))}
#notes:empty{display:none}
.note{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:6px 10px 6px 6px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;animation:noteIn .5s var(--spring) both}
.notemain{background:none;border:0;text-align:left;padding:8px 10px;min-width:0;border-radius:12px}
.notemain b{font-weight:600;display:block}
.notemain span{font-size:13px;color:var(--ink-2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes noteIn{from{opacity:0;transform:translate3d(0,-14px,0) scale(.96)}to{opacity:1;transform:none}}
/* 공부방: 참여 인원 줄, 노동요 */
.fr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;border-top:1px solid var(--line)}
.frmain{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;background:none;border:0;padding:11px 0;text-align:left;min-width:0}
.song{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ct + .song,.songform + .song{border-top:0}
.song a,.song b{color:var(--ink);font-weight:600;text-decoration:none;display:block}
.song a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.song small{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song small.url{white-space:normal;word-break:break-all;-webkit-user-select:all;user-select:all;color:var(--ink-2)}
.songform{display:grid;gap:8px;margin-bottom:8px}

@keyframes viewIn{from{opacity:0;transform:translate3d(0,calc(var(--dir,1)*22px),0)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translate3d(0,calc(var(--dir,1)*-12px),0)}}
@keyframes cardIn{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes dlgIn{from{opacity:0;transform:translate3d(0,22px,0) scale(.95)}to{opacity:1;transform:none}}
@keyframes dlgOut{to{opacity:0;transform:translate3d(0,12px,0) scale(.98)}}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}18%{opacity:1;transform:translate(-50%,-110%) scale(1)}70%{opacity:1;transform:translate(-50%,-150%) scale(1)}100%{opacity:0;transform:translate(-50%,-200%) scale(.97)}}

@media (min-width:700px){
  .dfoot.two{grid-template-columns:minmax(0,1fr) auto;align-items:center}
}
@media (max-width:899px){
  .chat{grid-template-columns:minmax(0,1fr)}
  .chlist{display:flex;overflow-x:auto;gap:4px;scrollbar-width:none}
  .chrow{width:auto;flex:none}
  .cols{grid-template-columns:minmax(0,1fr)}
  .calwrap{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"cal" "day" "up"}
}
@media (max-width:699px){
  #app{flex-direction:column-reverse}
  .rail{width:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:0 6px 0 0}
  .navs{flex-direction:row;flex:1;width:auto}
  .navs button{flex:1;height:58px;gap:3px;font-size:9.5px;min-width:0}
  .navs .badge{top:8px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chrow small{display:none}
  .ind{top:5px;left:0;width:calc(100%/8);height:48px;background:none;transform:translateX(calc(var(--i,0)*100%))}
  .ind::after{content:"";position:absolute;inset:0 6px;background:var(--accent-soft);border-radius:14px}
  .mebtn{margin:0;align-self:center}
  .mebtn > span:last-child{display:none}
  main{padding:16px 12px 40px}
  .card{border-radius:18px;padding:16px}
  .calcard{padding:10px 6px 8px}
  .cell{min-height:66px;padding:3px 2px 5px;border-radius:10px}
  .cell .dn{width:24px;height:24px;font-size:13px}
  .ev{font-size:9.5px;padding:1px 3px;border-radius:4px;-webkit-line-clamp:1;word-break:break-all}
  .tbl{--cw:42px;padding:0}
  .olabel,.osum .olabel{padding-left:14px;padding-right:8px}
  .oitem .olabel{padding-left:22px}
  .chips.scroll{margin:0 -16px;padding:0 16px}
  .layer{place-items:end center;padding:calc(12px + env(safe-area-inset-top,0px)) 0 0}
  .dialog,.dialog.wide{width:100%;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .dialog.pic{margin-bottom:20px}
  .dh{padding:20px 18px 10px}.db{padding:4px 18px 22px}.dfoot{padding:12px 18px 16px}
  @keyframes viewIn{from{opacity:0;transform:translate3d(calc(var(--dir,1)*22px),0,0)}to{opacity:1;transform:none}}
  @keyframes viewOut{to{opacity:0;transform:translate3d(calc(var(--dir,1)*-12px),0,0)}}
  @keyframes dlgIn{from{transform:translate3d(0,100%,0)}to{transform:none}}
  @keyframes dlgOut{to{transform:translate3d(0,100%,0)}}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important}
}

/* 제목 글꼴 (컨셉마다 바뀜) */
.vhead h1,.gatebox h1,.dh h2,.ct h2{font-family:var(--font-display)}
.ct h2 small{font-family:var(--font-body)}

/* 설정: 컨셉과 대표 색 고르기 */
.lb{font-size:13px;font-weight:600;color:var(--ink-2);margin:16px 0 8px}
.lb small{font-weight:400;color:var(--ink-3);margin-left:6px}
.lb + .sws{margin-top:0}
.cvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.cv{background:none;border:0;padding:6px 6px 8px;border-radius:14px;display:grid;gap:6px;justify-items:center;font-size:13px;font-weight:600;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .3s var(--spring),box-shadow .2s,color .2s}
.cv:active{transform:scale(.96)}
.cv[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent-ink);color:var(--ink)}
.cvp{--pb:#F3F4F6;--pc:#FFFFFF;--pe:transparent;--pr:4px;display:block;width:100%;aspect-ratio:3/2;border-radius:9px;position:relative;overflow:hidden;background:var(--pb)}
.cvp i{position:absolute;display:block;background:var(--pc);border:1px solid var(--pe);border-radius:var(--pr)}
.cvp i:nth-child(1){left:11%;top:15%;width:48%;height:70%}
.cvp i:nth-child(2){left:65%;top:15%;width:24%;height:32%}
.cvp i:nth-child(3){left:65%;top:55%;width:24%;height:30%;background:var(--accent);border-color:var(--pe)}
[data-mode="dark"] .cvp{--pb:#0F1114;--pc:#191B20}
.cvp-grid{--pb:#EDF0F4;--pc:#FDFDFC;--pe:#D5DBE4;--pr:2px;background-image:linear-gradient(rgba(52,84,140,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(52,84,140,.16) 1px,transparent 1px);background-size:8px 8px}
[data-mode="dark"] .cvp-grid{--pb:#14171C;--pc:#1B1F26;--pe:#353C48;background-image:linear-gradient(rgba(160,185,230,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(160,185,230,.1) 1px,transparent 1px)}
.cvp.cvp-board{--pb:#1E3A31;--pc:transparent;--pe:rgba(244,242,232,.7);--pr:3px}
.cvp-pop{--pb:var(--accent-soft);--pc:#FFFFFF;--pe:#23252B;--pr:4px}
.cvp-pop i{border-width:1.5px;box-shadow:1.5px 1.5px 0 #23252B}
[data-mode="dark"] .cvp-pop{--pb:#121316;--pc:#202228;--pe:#F2F3F5}
[data-mode="dark"] .cvp-pop i{box-shadow:1.5px 1.5px 0 var(--accent)}
.cvp-line{--pb:#FFFFFF;--pc:#FFFFFF;--pe:#1A1C20;--pr:0px}
[data-mode="dark"] .cvp-line{--pb:#0F1113;--pc:#0F1113;--pe:#E6E8EC}
.cvp-glass{--pb:#EDF0F5;--pc:rgba(255,255,255,.6);--pe:rgba(255,255,255,.9);background-image:radial-gradient(80% 80% at 0% 0%,var(--accent),transparent 70%),radial-gradient(70% 70% at 100% 100%,var(--accent-mark),transparent 70%)}
[data-mode="dark"] .cvp-glass{--pb:#0D0F13;--pc:rgba(40,44,54,.6);--pe:rgba(255,255,255,.16)}
.cvp-glass i:nth-child(3){background:rgba(255,255,255,.6)}
[data-mode="dark"] .cvp-glass i:nth-child(3){background:rgba(40,44,54,.6)}
.cvp.cvp-night{--pb:#0B0F2A;--pc:#151A3F;--pe:#2F3670;--pr:5px;background-image:radial-gradient(circle at 12% 20%,#fff 0 .8px,transparent 1.2px),radial-gradient(circle at 58% 9%,#fff 0 .6px,transparent 1px),radial-gradient(circle at 92% 52%,#fff 0 .8px,transparent 1.2px),radial-gradient(circle at 60% 92%,#fff 0 .6px,transparent 1px),linear-gradient(180deg,#0A0E28,#19143C)}

/* 메시지: 사진, 이모티콘, 수정과 삭제 */
.cin{grid-template-columns:minmax(0,1fr)}
.cinrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center}
.cinrow.ed{grid-template-columns:minmax(0,1fr) auto}
.cinrow [hidden]{display:none}
#stkSlot:empty,#cinTop:empty{display:none}
.cbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border-radius:12px;padding:2px 4px 2px 14px;font-size:13px;font-weight:600;color:var(--accent-ink)}
.bb.pic{padding:6px;display:grid;gap:6px}
.bb.pic .shot{margin-top:0;border-radius:11px}
.bb.pic .cap{padding:0 7px 3px}
.mine [data-act="msg-pick"]{cursor:pointer}
.mrowx.sel > .bb,.mrowx.sel > .stk{outline:2px solid var(--accent-ink);outline-offset:2px}
.mt{background:none;border:0;padding:2px 6px 0;font-size:11px;color:var(--ink-3)}
.mact{display:flex;gap:6px;margin-top:6px;animation:rowIn .3s var(--ease) both}
.stk{display:block;width:128px;height:128px;border-radius:14px;flex:none}
.stk img{display:block;width:100%;height:100%;object-fit:contain;transform-origin:50% 82%;animation-duration:2.4s;animation-timing-function:ease-in-out;animation-iteration-count:3}
.stk[data-m="bounce"] img{animation-name:ssBounce}
.stk[data-m="sway"] img{animation-name:ssSway}
.stk[data-m="tilt"] img{animation-name:ssTilt}
.stk[data-m="sleep"] img{animation-name:ssSleep;animation-duration:3.6s}
.stk[data-m="nod"] img{animation-name:ssNod}
.stk[data-m="pulse"] img{animation-name:ssPulse}
.stk[data-m="breathe"] img{animation-name:ssPulse;animation-duration:4s}
.stk[data-m="shake"] img{animation-name:ssShake}
.stk[data-m="nudge"] img{animation-name:ssNudge}
.stk[data-m="float"] img{animation-name:ssFloat}
.stk[data-m="pop"] img{animation-name:ssPop}
@keyframes ssBounce{0%,35%,65%,100%{transform:translateY(0)}48%{transform:translateY(-7%) scale(.98,1.02)}58%{transform:scale(1.02,.98)}}
@keyframes ssSway{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes ssTilt{0%,25%,100%{transform:rotate(0)}45%,70%{transform:rotate(-7deg)}}
@keyframes ssSleep{0%,100%{transform:rotate(0) scaleY(1)}30%{transform:rotate(-2deg) scaleY(1)}70%{transform:rotate(2deg) scaleY(.97)}}
@keyframes ssNod{0%,35%,80%,100%{transform:translateY(0)}52%,67%{transform:translateY(3%) rotate(2deg)}}
@keyframes ssPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes ssShake{0%,30%,70%,100%{transform:translateX(0)}40%,55%{transform:translateX(-2%)}47%,62%{transform:translateX(2%)}}
@keyframes ssNudge{0%,25%,75%,100%{transform:translateX(0)}45%,60%{transform:translateX(5%) rotate(2deg)}}
@keyframes ssFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes ssPop{0%,30%,75%,100%{transform:scale(1)}45%{transform:scale(1.07)}60%{transform:scale(.99)}}
.stkpick{border-top:1px solid var(--line);padding:12px 0 4px;display:grid;gap:10px;animation:rowIn .35s var(--ease) both}
.stkpick .seg{background:var(--fill);justify-self:start}
.stkgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stkbtn{background:none;border:0;border-radius:14px;padding:6px;aspect-ratio:1;width:100%;max-width:124px;justify-self:center;transition:transform .3s var(--spring),background .2s}
.stkbtn:active{transform:scale(.9);background:var(--fill)}
.stkbtn img{display:block;width:100%;height:100%;object-fit:contain}

/* 메시지 메뉴의 안 읽은 개수 */
.navs .badge{top:6px;margin-left:5px;width:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;color:var(--on-red);font-size:11px;font-weight:700;font-style:normal;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.cnt{color:var(--on-red)}

/* 노동요 */
.songform{margin-bottom:6px}
.songnew{display:grid;gap:8px;animation:rowIn .3s var(--ease) both}
.sfilter{margin:6px 0 4px}
.sfilter .chip{min-height:32px;padding:3px 12px;font-size:13px}
.song{gap:8px 10px;padding:11px 10px;margin:0 -10px;transition:background .2s}
.song.pick{background:var(--accent-soft);border-radius:12px;border-top-color:transparent}
.song.pick + .song{border-top-color:transparent}
.song.pick .tag.a{background:var(--surface)}
.st{display:block;max-width:100%;background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink)}
.smeta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:5px}
.smeta small{font-size:12px;color:var(--ink-3)}
.snow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--accent-ink);margin-top:3px}
.snow .del{height:26px;font-size:12px}

/* ===== 컨셉 디자인: 색 토큰은 그대로 두고 면, 선, 글꼴만 바꾼다 ===== */

/* 모눈 노트 */
:root[data-concept="grid"]{--bg:#EDF0F4;--surface:#FDFDFC;--fill:#EEF1F5;--line:#D5DBE4;--grid:rgba(52,84,140,.12);--font-display:'Nanum Pen Script',var(--font-body)}
:root[data-concept="grid"][data-mode="dark"]{--bg:#14171C;--surface:#1B1F26;--fill:#262B34;--line:#353C48;--grid:rgba(160,185,230,.07)}
[data-concept="grid"] body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
[data-concept="grid"] :is(.card,.tile,.person,.note){border:1px solid var(--line);border-radius:8px}
[data-concept="grid"] :is(.pill,.ib,.seg){border:1px solid var(--line)}
[data-concept="grid"] .dialog:not(.pic){border-radius:12px}
[data-font="ok"][data-concept="grid"] :is(.vhead h1,.gatebox h1){font-size:clamp(32px,4.1vw,41px);font-weight:400;letter-spacing:0;line-height:1.08}
[data-font="ok"][data-concept="grid"] .ct h2{font-size:24px;font-weight:400;letter-spacing:0;line-height:1.15}
[data-font="ok"][data-concept="grid"] .ct h2 small{font-size:14px}
[data-font="ok"][data-concept="grid"] .dh h2{font-size:29px;font-weight:400;letter-spacing:0}

/* 칠판 (항상 어둡게) */
:root[data-concept="board"]{--bg:#1E3A31;--surface:#24443A;--fill:#2E5145;--line:#456A5C;--ink:#F4F2E8;--ink-2:#C9D6CC;--ink-3:#9DB5A8;--red:#FFA9A6;--red-soft:#503A38;--scrim:rgba(6,18,14,.64);--shadow:0 30px 70px -26px rgba(0,0,0,.7);--chalk:rgba(244,242,232,.5);--font-display:'Gaegu',var(--font-body)}
[data-concept="board"] :is(.card,.tile,.person){background:none;border:1.5px solid var(--chalk);border-radius:10px}
[data-concept="board"] :is(.pill,.ib,.seg){background:none;border:1.5px solid var(--line)}
[data-concept="board"] :is(.dialog:not(.pic),.note){border:1.5px solid var(--chalk);border-radius:14px}
[data-concept="board"] .rail{background:#1A332B}
[data-font="ok"][data-concept="board"] :is(.vhead h1,.gatebox h1){font-size:clamp(27px,3.4vw,35px);font-weight:700;letter-spacing:0}
[data-font="ok"][data-concept="board"] .ct h2{font-size:21px;letter-spacing:0;line-height:1.2}
[data-font="ok"][data-concept="board"] .ct h2 small{font-size:14px}
[data-font="ok"][data-concept="board"] .dh h2{font-size:26px;font-weight:700;letter-spacing:0}

/* 말랑: 이모티콘처럼 굵은 테두리와 단단한 그림자 */
:root[data-concept="pop"]{--bg:var(--accent-soft);--surface:#FFFFFF;--fill:#F1F2F5;--line:#E1E4EA;--edge:#23252B;--hard:#23252B;--font-display:'Jua',var(--font-body)}
:root[data-concept="pop"][data-mode="dark"]{--bg:#121316;--surface:#202228;--fill:#2B2E36;--line:#3B3F49;--edge:#F2F3F5;--hard:var(--accent)}
[data-concept="pop"] :is(.card,.tile,.person,.note,.dialog:not(.pic)){border:2px solid var(--edge);box-shadow:4px 4px 0 var(--hard)}
[data-concept="pop"] :is(.pill,.ib,.seg,.chip){border:2px solid var(--edge)}
[data-concept="pop"] .btn{border:2px solid var(--edge);box-shadow:2px 2px 0 var(--hard);transition:transform .12s,box-shadow .12s,background .2s,opacity .2s}
[data-concept="pop"] .btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--hard)}
[data-concept="pop"] :is(input[type=text],select,textarea){box-shadow:inset 0 0 0 2px var(--edge)}
[data-concept="pop"] :is(input[type=text],select,textarea):focus{box-shadow:inset 0 0 0 2px var(--edge),0 0 0 3px var(--accent-mark)}
[data-concept="pop"] .rail{border-color:var(--edge);border-width:0 2px 0 0}
[data-font="ok"][data-concept="pop"] :is(.vhead h1,.gatebox h1,.dh h2,.ct h2){font-weight:400;letter-spacing:0}
[data-font="ok"][data-concept="pop"] .ct h2{font-size:18px}

/* 선: 채움 없이 가는 선으로만 */
:root[data-concept="line"]{--bg:#FFFFFF;--surface:#FFFFFF;--fill:#F3F4F6;--line:#D9DCE2;--edge:#1A1C20}
:root[data-concept="line"][data-mode="dark"]{--bg:#0F1113;--surface:#0F1113;--fill:#1B1E23;--line:#2F343C;--edge:#E6E8EC}
[data-concept="line"] :is(.card,.tile,.person,.note,.dialog:not(.pic)){border:1px solid var(--edge);border-radius:4px}
[data-concept="line"] :is(.btn,.chip,.x,.pill,.ib,.seg,.seg button,.tag,.ev,.bcell,.bdg,.cell,.bb,.sys,.av,.d7 i,.ind,.shot,.thumb,.preview,.picked,.undo,.cbar,.rb,.ans,.amt button,.chrow,.goal,.notemain,.stk,.stkbtn,.cv,.cvp,.pen div,.wt td,input[type=text],select,textarea){border-radius:3px}
[data-concept="line"] :is(.chk > span,.mk:not(.off)){border-radius:4px}
[data-concept="line"] :is(.pill,.ib,.seg){border:1px solid var(--line)}
[data-concept="line"] .btn{background:none;border:1px solid var(--edge)}
[data-concept="line"] .btn.primary{background:var(--accent)}
[data-concept="line"] .btn.soft{background:var(--accent-soft)}
[data-concept="line"] .chip{background:none;border:1px solid var(--line)}
[data-concept="line"] .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--edge)}
[data-concept="line"] :is(input[type=text],select,textarea){background:none;box-shadow:inset 0 0 0 1px var(--line)}
[data-concept="line"] :is(input[type=text],select,textarea):focus{box-shadow:inset 0 0 0 1.5px var(--accent-ink)}
[data-concept="line"] .rail{border-color:var(--edge)}

/* 유리: 대표 색이 번진 바탕 위에 반투명 면 */
:root[data-concept="glass"]{--bg:#EDF0F5;--surface:#FFFFFF;--fill:rgba(118,128,150,.13);--line:rgba(118,128,150,.24)}
:root[data-concept="glass"][data-mode="dark"]{--bg:#0D0F13;--surface:#1B1E25;--fill:rgba(255,255,255,.09);--line:rgba(255,255,255,.13)}
[data-concept="glass"] body{background:radial-gradient(70% 55% at 8% 0%,color-mix(in srgb,var(--accent) 36%,transparent),transparent 70%),radial-gradient(60% 60% at 100% 100%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 70%),radial-gradient(45% 40% at 92% 6%,color-mix(in srgb,var(--accent-mark) 22%,transparent),transparent 70%),var(--bg)}
[data-concept="glass"] :is(.card,.tile,.person,.pill,.ib,.seg,.note){background:color-mix(in srgb,var(--surface) 56%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid color-mix(in srgb,var(--surface) 62%,transparent);box-shadow:0 14px 34px -22px rgba(20,24,40,.4)}
[data-concept="glass"] .rail{background:color-mix(in srgb,var(--surface) 50%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border-color:color-mix(in srgb,var(--surface) 62%,transparent)}
[data-concept="glass"] .dialog:not(.pic){background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(28px) saturate(1.5);backdrop-filter:blur(28px) saturate(1.5);border:1px solid color-mix(in srgb,var(--surface) 62%,transparent)}

/* 밤하늘 (항상 어둡게) */
:root[data-concept="night"]{--bg:#0B0F2A;--surface:#151A3F;--fill:#1F2553;--line:#2F3670;--ink:#EEF0FF;--ink-2:#B9C0EC;--ink-3:#8F98CC;--red:#FF8E9E;--red-soft:#3B2244;--scrim:rgba(4,6,22,.66);--shadow:0 30px 70px -26px rgba(0,0,0,.8);--font-display:'Gowun Batang',var(--font-body)}
[data-concept="night"] body{background-color:#0B0F2A;background-image:radial-gradient(circle at 22px 34px,rgba(255,255,255,.85) 0 .9px,transparent 1.5px),radial-gradient(circle at 120px 88px,rgba(255,255,255,.55) 0 .7px,transparent 1.3px),radial-gradient(circle at 210px 40px,rgba(255,255,255,.7) 0 1.1px,transparent 1.7px),radial-gradient(circle at 70px 190px,rgba(255,255,255,.45) 0 .7px,transparent 1.3px),linear-gradient(180deg,#0A0E28,#19143C);background-size:211px 211px,173px 173px,307px 307px,257px 257px,100% 100%}
[data-concept="night"] :is(.card,.tile,.person,.note){background:rgba(21,26,63,.88);border:1px solid var(--line);border-radius:22px}
[data-concept="night"] :is(.pill,.ib,.seg){background:rgba(21,26,63,.88);border:1px solid var(--line)}
[data-concept="night"] .dialog:not(.pic){border:1px solid var(--line)}
[data-concept="night"] .rail{background:rgba(12,16,44,.92)}
[data-font="ok"][data-concept="night"] :is(.vhead h1,.gatebox h1,.dh h2,.ct h2){font-weight:700;letter-spacing:-.01em}

@media (max-width:699px){
  .cinrow{grid-template-columns:auto auto minmax(0,1fr)}
  .cinrow > input{grid-column:1/-1;grid-row:1}
  .cinrow > .btn.primary{justify-self:end}
  .cinrow.ed{grid-template-columns:minmax(0,1fr) auto}
  .cinrow.ed > input{grid-column:auto;grid-row:auto}
  .stkgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .song{grid-template-columns:minmax(0,1fr)}
  .msgs{height:clamp(200px,38vh,400px)}
  .navs .badge{top:4px}
  .stk{width:112px;height:112px}
  [data-concept] .dialog:not(.pic){border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-width:0}
  [data-concept="pop"] .rail{border-width:2px 0 0 0}
  [data-concept="pop"] :is(.card,.tile,.person,.note){box-shadow:3px 3px 0 var(--hard)}
}

/* 타이머 종류 */
.card .seg.tseg{display:grid;background:var(--fill);margin-bottom:12px}
.card .seg.tseg button{padding:0 6px}
.tset{display:grid;gap:10px;margin-top:12px;animation:rowIn .3s var(--ease) both}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.trow > span{font-size:14px;font-weight:600;color:var(--ink-2)}
.trow .amt{margin:0}
.trow .amt b{font-size:18px;min-width:104px}
.ring{position:relative;width:min(232px,74%);aspect-ratio:1;margin:18px auto 16px}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .rg-t{stroke:var(--fill)}
.ring .rg-p{stroke:var(--accent-mark);stroke-linecap:round;stroke-dasharray:565.49;transition:stroke-dashoffset 1s linear}
.ring.rest .rg-p{stroke:var(--ink-3)}
.ring.idle .rg-p{display:none}
.rg-in{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:3px;text-align:center;padding:0 24px}
.rg-in small{font-size:13px;font-weight:600;color:var(--accent-ink)}
.ring.rest .rg-in small,.ring.idle .rg-in small{color:var(--ink-3)}
.rg-in span{font-size:13px;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tacts{display:grid;gap:8px}
.tsnd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.tsnd .del{height:30px;color:var(--accent-ink);font-weight:600}
.fr small.live.rest{color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.ring .rg-p{transition:none}}

/* 타이머 크게 보기 */
.layer.fullv{padding:0;place-items:stretch}
.fview{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg);padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));outline:0;animation:fadeIn .3s ease both;overflow:auto}
.layer.closing .fview{animation:fadeOut .2s ease both}
.fview .ring{width:min(60vmin,440px);margin:0 auto 30px}
.fview .ring circle{stroke-width:7}
.fview .rg-in{gap:6px;padding:0 12%}
.fview .rg-in small,.fview .rg-in span{font-size:clamp(14px,2.6vmin,20px)}
.fview .clock{font-size:clamp(54px,16vmin,144px);margin:0}
.fview .clocksub{font-size:clamp(15px,2.8vmin,22px);margin:6px 0 34px}
.fview .tacts{width:min(360px,100%)}
.fview .rg-t{stroke:var(--line)}
.fview .btn:not(.soft){background:var(--surface)}
.ring.idle{width:min(184px,60%);margin:14px auto 14px}

/* 타이머 모양: 링, 숫자, 막대, 원판, 넘김 시계 */
.tf{container-type:inline-size;text-align:center}
.tf .tt{display:block;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.12;white-space:nowrap}
.tf small{display:block;font-size:13px;font-weight:600;color:var(--accent-ink)}
.tf.rest small,.tf.idle small{color:var(--ink-3)}
.tf > span,.tf .rg-in > span,.tf .ptx > span{display:block;max-width:100%;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tf.idle .tt{color:var(--ink-3)}
.ring .rg-in{padding:0 14%}
.ring .tt{font-size:40px;font-size:clamp(26px,19cqw,46px)}
.ring .tt.long{font-size:34px;font-size:clamp(22px,14.5cqw,40px)}
.tf.digits,.tf.bar,.tf.flipf{display:grid;gap:6px;padding:20px 0 18px;justify-items:center}
.tf.bar{justify-items:stretch}
.digits .tt{font-size:64px;font-size:clamp(44px,19cqw,96px)}
.digits .tt.long{font-size:52px;font-size:clamp(34px,14.5cqw,84px)}
.bar .tt{font-size:52px;font-size:clamp(38px,15cqw,72px)}
.bar .tt.long{font-size:44px;font-size:clamp(32px,12cqw,64px)}
.bbar{height:14px;border-radius:999px;background:var(--fill);overflow:hidden;margin:6px 0 2px}
.bbar i{display:block;height:100%;border-radius:inherit;background:var(--accent-mark);transition:width 1s linear}
.bar.rest .bbar i{background:var(--ink-3)}
.bar.idle .bbar i{background:var(--line)}
.tf.pie{display:grid;justify-items:center;gap:12px;padding:14px 0 16px}
.pie svg{display:block;width:min(212px,68%);aspect-ratio:1}
.pie .pf{fill:var(--surface);stroke:var(--line);stroke-width:2}
.pie .pw{fill:var(--accent-mark)}
.pie.rest .pw{fill:var(--ink-3)}
.pie.idle .pw{opacity:.35}
.pie .pt line{stroke:var(--ink-3);stroke-width:1.2;stroke-linecap:round}
.pie .pt line.bg{stroke:var(--ink-2);stroke-width:2.4}
.pie .pk{fill:var(--ink)}
.ptx{display:grid;gap:2px;justify-items:center;max-width:100%}
.pie .tt{font-size:40px;font-size:clamp(30px,12cqw,52px)}
.pie .tt.long{font-size:34px;font-size:clamp(26px,9.5cqw,44px)}
.tt.flip{display:flex;justify-content:center;align-items:center;gap:.07em;letter-spacing:0;font-size:46px;font-size:clamp(28px,15cqw,64px)}
.tt.flip.long{font-size:40px;font-size:clamp(24px,11.5cqw,56px)}
.flip i{position:relative;display:inline-grid;place-items:center;width:.78em;height:1.2em;border-radius:.12em;background:var(--ink);color:var(--surface);font-style:normal;overflow:hidden;transform-origin:50% 50%}
.flip i::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--surface);opacity:.3}
.flip em{font-style:normal;width:.3em;text-align:center;color:var(--ink-2)}
.flipf.idle .flip i{background:var(--fill);color:var(--ink-3)}
.flipf.rest .flip i{background:var(--ink-2)}
.flip i.chg{animation:flipIn .4s var(--ease)}
@keyframes flipIn{from{transform:perspective(240px) rotateX(-80deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.flip i.chg{animation:none}.bbar i{transition:none}}
.fview .tf{width:min(92vw,900px)}
.fview .tf.ring{width:min(60vmin,440px)}
.fview .tf small,.fview .tf .rg-in > span,.fview .tf > span,.fview .tf .ptx > span{font-size:clamp(14px,2.6vmin,20px)}
.fview .digits .tt{font-size:clamp(56px,19vmin,190px)}
.fview .digits .tt.long{font-size:clamp(46px,14.5vmin,160px)}
.fview .bar .tt{font-size:clamp(50px,15vmin,150px)}
.fview .bar .tt.long{font-size:clamp(42px,12vmin,130px)}
.fview .bbar{height:clamp(14px,2.4vmin,24px)}
.fview .pie svg{width:min(52vmin,420px)}
.fview .pie .tt{font-size:clamp(40px,9vmin,96px)}
.fview .pie .tt.long{font-size:clamp(34px,7.5vmin,84px)}
.fview .tt.flip{font-size:clamp(40px,14vmin,140px)}
.fview .tt.flip.long{font-size:clamp(34px,11vmin,120px)}
.fview .tf.digits,.fview .tf.bar,.fview .tf.flipf,.fview .tf.pie{margin-bottom:26px}

/* 설정의 타이머 모양 미리보기 */
.tsp{display:grid;place-items:center;align-content:center;gap:4px;width:100%;aspect-ratio:3/2;border-radius:9px;background:var(--fill);color:var(--ink);overflow:hidden}
.tsp svg{width:58%;height:auto}
.tsp .k{fill:none;stroke:var(--line);stroke-width:5}
.tsp .a{fill:none;stroke:var(--accent-mark);stroke-width:5;stroke-linecap:round}
.tsp .f{fill:var(--surface);stroke:var(--line);stroke-width:2}
.tsp .w{fill:var(--accent-mark)}
.tsp .n{fill:var(--ink)}
.tsp b{font-size:17px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.tsp-bar i{display:block;width:62%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tsp-bar u{display:block;width:70%;height:100%;background:var(--accent-mark)}
.tsp-flip b{display:flex;gap:2px;align-items:center;font-size:14px}
.tsp-flip i{display:inline-grid;place-items:center;width:13px;height:19px;border-radius:3px;background:var(--ink);color:var(--surface);font-style:normal}
.tsp-flip em{font-style:normal;color:var(--ink-2)}

/* 도전 나눠 보기, 대결 알림 숫자, 삭제 확인 */
.pwrap{max-width:820px}
.seg .sbadge{display:inline-block;min-width:17px;height:17px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red);color:var(--on-red);font-size:11px;font-weight:700;line-height:17px;vertical-align:1px}
.btn.warn{background:var(--red-soft);color:var(--red)}
.mrow .acts .btn.small{height:32px;padding:0 12px}
.fview .ring .tt{font-size:clamp(40px,19cqw,112px)}
.fview .ring .tt.long{font-size:clamp(34px,14.5cqw,96px)}

/* 마감 있는 할 일, 묶어 보기, 할 일 편집 */
.calwrap > .upcol{grid-area:up;display:grid;gap:16px;min-width:0;align-content:start}
.seg.mini{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);margin:0 0 10px;padding:3px}
.seg.mini button{height:30px;font-size:13px;padding:0 8px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 0 4px;font-size:13px;font-weight:700;color:var(--ink-2);border-top:1px solid var(--line);margin-top:4px}
.ghead:first-child{border-top:0;margin-top:0;padding-top:2px}
.ghead small{font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.goal.sel{background:var(--fill)}
.gmore{background:none;border:0;color:var(--ink-3);font-size:13px;height:38px;padding:0 8px;border-radius:10px;white-space:nowrap}
.gmore:active{background:var(--fill)}
.gacts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0 10px 34px;animation:rowIn .25s var(--ease) both}
.gdate{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.gdate input{height:32px;padding:0 8px;font-size:13px;border-radius:10px;width:auto}
.gt.gedit{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;grid-column:2 / 4}
.gedit input{flex:1;min-width:0;height:38px}
.tag.due{background:var(--accent-soft);color:var(--accent-ink)}
.ev.due{background:transparent;color:var(--accent-ink);box-shadow:inset 0 0 0 1px currentColor}
.plink{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--fill)}
.drow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.drow input{width:auto;height:38px}
.chips.dows .chip{min-width:44px;justify-content:center;text-align:center}
.pdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.pday{display:grid;gap:2px;padding:7px 8px;border-radius:12px;border:0;background:var(--fill);text-align:left;color:var(--ink-3);transition:background .2s,color .2s}
.pday small{font-size:11.5px;color:inherit}
.pday b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pday.on{background:var(--accent-soft);color:var(--accent-ink)}
.pday.off b{text-decoration:line-through}
.pday.full{opacity:.55}
.plrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ct + .plrow,.seg.mini + .plrow,.plgh + .plrow{border-top:0}
.plmain{display:grid;gap:5px;background:none;border:0;padding:0;text-align:left;min-width:0;color:var(--ink)}
.pltop{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.pltop b{font-weight:600}
.plbar{display:block;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.plbar i{display:block;height:100%;background:var(--accent-mark);border-radius:inherit;transition:width .5s var(--ease)}
.plmain small{font-size:12px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dd{font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.dd.hot{color:var(--red)}
.plrow.fin .pltop b{color:var(--ink-3)}
.plrow.fin .plbar i{background:var(--ink-3)}
.plbody{padding:0 0 12px;animation:rowIn .25s var(--ease) both}
.pparts{display:grid;gap:0;list-style:none;margin:0;padding:0}
.pparts li{display:grid;grid-template-columns:40px 70px minmax(0,1fr);align-items:center;gap:4px;font-size:14px}
.pparts .chk{width:40px;height:38px}
.pparts .pdate{background:none;border:0;padding:0;text-align:left;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pparts li.today .pdate{color:var(--accent-ink);font-weight:700}
.pparts li.late .pdate{color:var(--red)}
.pparts li.done .ptxt{color:var(--ink-3);text-decoration:line-through}
.plgh{font-size:13px;font-weight:700;color:var(--ink-2);margin:12px 0 2px}
.plgh small{font-weight:500;color:var(--ink-3);margin-left:6px}
.plfin{display:block;background:none;border:0;padding:10px 0 0;color:var(--ink-3);font-size:13px}

/* 되돌리기, 끝낸 일 아래로, 공부 목표, 단축키 */
.flash{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.flash button{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px 6px;border-radius:6px}
.gtools{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.gtools .seg.mini{flex:1;margin:0;min-width:0}
.gtools .chip{min-height:36px;padding:4px 12px;font-size:13px;white-space:nowrap;flex:none}
.sgoal{display:grid;gap:4px;margin:2px 0 12px}
.gbar{height:8px;border-radius:999px;background:var(--fill);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:inherit;background:var(--accent-mark);transition:width .6s var(--ease)}
.sgoal small{font-size:12px;color:var(--ink-3)}
#c-now .sgoal{margin:10px 0 0}
.askg{font-size:16px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kbd{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kbd li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.kbd kbd{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:5px 7px;border-radius:7px;background:var(--fill);color:var(--ink);text-align:center;box-shadow:inset 0 -1px 0 var(--line)}
@media (max-width:699px){.gtools{flex-wrap:wrap}.gtools .seg.mini{flex:1 1 100%}}

/* 보기 방식 전환: 미끄러지는 표시 */
.seg.mini.cmode{min-width:204px;background:var(--surface);margin:0}
.seg.mini.cmode,.seg.mini.ttspan,.seg.mini.ttsets{position:relative;gap:0;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.seg.mini.cmode::before,.seg.mini.ttspan::before,.seg.mini.ttsets::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));border-radius:9px;background:var(--accent);transform:translateX(calc(var(--i,0) * 100%));transition:transform .45s var(--spring)}
.seg.mini.cmode button,.seg.mini.ttspan button,.seg.mini.ttsets button{position:relative;z-index:1;background:none !important;white-space:nowrap}
.seg.mini.cmode button[aria-pressed="true"],.seg.mini.ttspan button[aria-pressed="true"],.seg.mini.ttsets button[aria-pressed="true"]{color:var(--on-accent)}
.mnav h1.wkt{min-width:0;white-space:nowrap;font-size:clamp(19px,2.6vw,26px)}
@media (max-width:699px){.vacts .cmode{flex:1 1 auto}}
/* 화면 바뀔 때 */
.vbody{--vx:0px;--vy:14px;animation:vbIn .46s var(--ease) both}
.vbody.side{--vx:calc(var(--vd,0) * 36px);--vy:0px}
@keyframes vbIn{from{opacity:0;transform:translate3d(var(--vx),var(--vy),0)}to{opacity:1;transform:none}}

/* 할 일: 주간 달력 */
.wkcard .ct{margin-bottom:8px}
.wklate{font-size:13px;color:var(--red);font-weight:600}
.wkscroll{overflow-x:auto;margin:0 -20px;padding:0 20px;scroll-snap-type:x proximity;scroll-padding:0 20px;scrollbar-width:none}
.wkscroll::-webkit-scrollbar{display:none}
.wk{display:grid;grid-template-columns:repeat(7,minmax(94px,1fr))}
.wkh{display:flex;align-items:center;gap:5px;padding:4px 6px 8px;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:var(--ink);text-align:left;scroll-snap-align:start;min-width:0;cursor:pointer}
.wkh + .wkh,.wkc + .wkc{border-left:1px solid var(--line)}
.wkh small{font-size:12px;font-weight:600;color:var(--ink-3)}
.wkh b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;min-width:28px;height:28px;padding:0 4px;display:grid;place-items:center;border-radius:14px;transition:background .3s,color .3s}
.wkh em{margin-left:auto;font-style:normal;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.wkh em.all{color:var(--accent-ink);font-weight:700}
.wkh.sun small,.wkh.sun b{color:var(--red)}
.wkh.past b{color:var(--ink-2)}
.wkh.today b{background:var(--accent);color:var(--on-accent)}
.wkh.today,.wkc.today{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.wkc{padding:8px 5px 10px;display:flex;flex-direction:column;gap:5px;min-width:0;min-height:200px}
.wkbar{height:3px;border-radius:2px;background:var(--fill);overflow:hidden;margin:0 3px 3px;flex:none}
.wkbar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .5s var(--ease)}
.wkdue{font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:2px 6px;line-height:1.45;overflow-wrap:anywhere}
.wki{position:relative;display:grid;grid-template-columns:25px minmax(0,1fr);align-items:start;border-radius:8px;background:var(--fill);background:color-mix(in srgb,var(--sc) 13%,var(--surface));animation:rowIn .4s var(--ease) both;transition:background .3s}
.wki::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:2px;background:var(--sc);transition:opacity .3s}
.wkchk{width:25px;height:28px;display:grid;place-items:center;background:none;border:0;padding:0 0 0 4px}
.wkchk span{position:relative;width:15px;height:15px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.6px color-mix(in srgb,var(--sc) 70%,var(--ink-3));transition:background .25s,box-shadow .25s,transform .3s var(--spring)}
.wkchk span::after{content:"";position:absolute;left:5px;top:2.5px;width:4px;height:7.5px;border:solid var(--surface);border-width:0 1.8px 1.8px 0;transform:rotate(45deg) scale(0);transition:transform .35s var(--spring)}
.wkchk.on span{background:var(--sc);box-shadow:inset 0 0 0 1.6px var(--sc)}
.wkchk.on span::after{transform:rotate(45deg) scale(1)}
.wkchk:active span{transform:scale(.85)}
.wkchk:disabled{cursor:default}
.wkchk:disabled span{opacity:.65}
.wkt{display:grid;gap:1px;padding:5px 6px 6px 2px;text-align:left;background:none;border:0;font:inherit;color:inherit;min-width:0;cursor:pointer}
.wkt .t{font-size:13px;line-height:1.4;font-weight:500;overflow-wrap:anywhere}
.wkt small{font-size:11px;color:var(--ink-3);line-height:1.35;overflow-wrap:anywhere}
.wkt small em{font-style:normal;color:var(--red);font-weight:600;margin-left:4px}
.wki.done{background:transparent}
.wki.done::before{opacity:.35}
.wki.done .t{color:var(--ink-3);text-decoration:line-through}
.wke{font-size:12px;color:var(--ink-3);padding:2px 4px}
.wkadd{margin-top:auto;align-self:flex-start;background:none;border:0;padding:4px 6px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-3);transition:background .2s,color .2s}
@media (hover:hover){.wkadd:hover{background:var(--fill);color:var(--ink-2)}button.wkt:hover .t{text-decoration:underline;text-decoration-color:var(--ink-3)}}
.wkhint{margin-top:10px}
@media (max-width:699px){.wk{grid-template-columns:repeat(7,minmax(128px,1fr))}.wkscroll{margin:0 -16px;padding:0 16px;scroll-padding:0 16px}}
[data-font="ok"][data-concept="grid"] .wkh b{font-family:var(--font-display);font-size:22px;font-weight:400}
[data-font="ok"][data-concept="board"] .wkh b{font-family:var(--font-display);font-size:19px}

/* 과목 색 표시 */
.stag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sc);margin-right:5px;vertical-align:1px}

/* 시간표 */
.tttools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tttools .acts{display:flex;gap:6px;flex-wrap:wrap}
.seg.mini.ttspan{margin:0;min-width:168px}
.ttnote{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px;animation:rowIn .4s var(--ease) both}
.ttnote p{font-size:14px;color:var(--accent-ink);font-weight:500}
.ttpickbar{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px;border-radius:12px;background:var(--fill);background:color-mix(in srgb,var(--sc) 15%,var(--surface));margin-bottom:10px;animation:noteIn .35s var(--spring) both}
.ttpickbar i{width:10px;height:10px;border-radius:50%;background:var(--sc);flex:none}
.ttpickbar span{flex:1;font-size:14px;min-width:0}
.ttscroll{position:relative;overflow:auto;max-height:min(72vh,920px);margin:0 -20px;border-top:1px solid var(--line);overscroll-behavior:contain}
.ttg{display:grid;min-width:100%}
.ttg.n1{grid-template-columns:46px minmax(0,1fr)}
.ttg.n3{grid-template-columns:46px repeat(3,minmax(92px,1fr))}
.ttg.n7{grid-template-columns:46px repeat(7,minmax(90px,1fr))}
.tthc,.tth{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
